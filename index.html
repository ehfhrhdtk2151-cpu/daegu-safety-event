<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전기뷰(Give U) 캠페인</title>
<style>
  body { margin:0; font-family: sans-serif; text-align:center; background:#f9f9f9; color: #333; overflow-x: hidden; }
  .step { display:none; padding:20px; max-width: 500px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; }
  .active { display:block; }
  
  #step1 { 
    display: none; padding: 0; background-image: url('intro.png'); background-size: contain; 
    background-position: top center; background-repeat: no-repeat; background-color: #FDF3D0; 
    position: relative; height: 100vh; 
  }
  #step1.active { display: flex; flex-direction: column; justify-content: flex-end; }
  #step1 button { margin: 0 20px 40px 20px; width: calc(100% - 40px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 10; }

  /* [디자인] 입체 온도계 */
  .thermometer-wrapper { position: relative; width: 220px; margin: 60px auto 30px; padding-top: 20px; }
  
  /* 아이콘 애니메이션 */
  .icon-cloud2 { position: absolute; right: -40px; top: 40px; font-size: 20px; opacity: 0.4; animation: float 4s infinite ease-in-out; }
  .icon-car { position: absolute; left: -60px; bottom: 80px; font-size: 30px; animation: drive 4s infinite linear; }
  .icon-heart { position: absolute; right: -45px; bottom: 120px; font-size: 22px; color: #ff416c; animation: beat 1.5s infinite; }
  .icon-star { position: absolute; left: -30px; top: 120px; font-size: 18px; color: #ffb800; animation: rotate 5s infinite linear; }

  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes drive { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(15px); } }
  @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
  @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .cheer-bubble {
    position: absolute; top: -50px; left: 50%; transform: translateX(-50%);
    background: #e63946; color: white; padding: 8px 18px; border-radius: 25px;
    font-size: 14px; font-weight: bold; white-space: nowrap; z-index: 10;
    box-shadow: 0 4px 12px rgba(230, 57, 70, 0.3);
  }
  .cheer-bubble::after { content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); border-top: 8px solid #e63946; border-left: 6px solid transparent; border-right: 6px solid transparent; }

  /* [강화] 온도계 몸체 그림자 */
  .thermometer-container {
    position: relative; width: 42px; height: 240px; margin: 0 auto;
    background: #ffffff; border: 4px solid #ffffff; border-radius: 30px 30px 0 0; 
    z-index: 1; overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35), inset 0 0 10px rgba(0,0,0,0.1); 
  }

  /* [강화] 액체 및 위아래 출렁임 효과 */
  .thermo-bar { 
    position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; 
    background: linear-gradient(to right, #d31027, #ff5f6d, #d31027);
    transition: height 1.5s cubic-bezier(0.17, 0.67, 0.83, 0.67);
    border-top: 2px solid rgba(255, 255, 255, 0.7); /* 수면 경계 뚜렷하게 */
  }
  
  /* 회전이 아닌 위아래로 출렁거리는 물결 */
  .thermo-bar::before {
    content: ""; position: absolute; top: -10px; left: -25%; width: 150%; height: 25px;
    background: rgba(180, 0, 0, 0.5); border-radius: 40%;
    animation: slosh 2.5s infinite ease-in-out; /* slosh 애니메이션 적용 */
    z-index: 5;
  }
  
  @keyframes slosh {
    0%, 100% { transform: translateX(-10%) scaleY(1); }
    50% { transform: translateX(10%) scaleY(1.4); } /* 위로 솟구치며 출렁임 */
  }

  /* [강화] 하단 구슬 그림자 */
  .thermo-bulb { 
    width: 90px; height: 90px; 
    background: radial-gradient(circle at 30% 30%, #ff5f6d, #d31027);
    border: 5px solid #ffffff; border-radius: 50%; margin: -35px auto 10px; position: relative; z-index: 2; 
    box-shadow: 0 10px 25px rgba(0,0,0,0.5); /* 아주 진한 그림자 */
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: bold; font-size: 17px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
  }
  
  /* 로딩 깜박임 */
  @keyframes pulse-glow {
    0%, 100% { filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.2)); opacity: 1; }
    50% { filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.6)); opacity: 0.8; }
  }
  .thermo-group-blinking { animation: pulse-glow 0.8s infinite ease-in-out; }

  .marks { 
    position: absolute; right: 145px; top: 15px; height: 240px; 
    display: flex; flex-direction: column; justify-content: space-between; 
    font-size: 13px; font-weight: bold; color: #888; text-align: right; width: 40px;
  }
  .mark-line-long { position: absolute; right: -25px; width: 15px; height: 2px; background: #ddd; }

  h2 { color: #0047a0; margin-top: 10px; font-size: 20px; word-break: keep-all; }
  .status-text { font-size: 22px; font-weight: bold; color: #000; margin: 10px 0; }
  .question-text { font-size: 22px; font-weight: bold; color: #333; margin: 15px 0 10px 0; }
  .slogan-banner {
    background: #eef4ff; color: #0047a0; padding: 10px; border-radius: 8px;
    font-size: 14px; font-weight: bold; margin: 0 auto 15px auto;
    border-left: 5px solid #0047a0; display: inline-block; width: 90%; line-height: 1.4;
  }

  button { padding: 18px 25px; font-size: 18px; width: 100%; border: none; border-radius: 10px; background: #852722; color: white; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
  button:active { transform: scale(0.98); }
  .btn-group { display: flex; gap: 10px; }
  .btn-no { background: #fff; color: #333; border: 2px solid #333; }
  canvas { border:2px solid #ddd; margin-top:20px; border-radius: 10px; background:#fff; touch-action: none; }
</style>
</head>
<body>

<div id="step0" class="step">
  <img src="safety_bye.jpg" style="width:80%; border-radius:20px; margin-top:40px;">
  <div id="step0Title" style="font-size:22px; font-weight:bold; color:#852722; margin-top:30px;">안내</div>
  <p id="step0Msg" style="font-size:18px; color:#333; margin-top:15px; line-height:1.6; word-break:keep-all;"></p>
  <button onclick="localStorage.removeItem('lastParticipatedDate'); location.reload();" 
          style="margin-top:50px; background:#aaaaaa; font-size:13px; padding:10px 15px; width:auto; border-radius:5px;">
    테스트용 초기화
  </button>
</div>

<div id="step1" class="step active"><button onclick="goNext(2)">캠페인 참여하기</button></div>

<div id="step2" class="step">
  <h2>배려운전이 안전운전의 시작입니다.</h2>
  <img src="safety.jpg" style="width:100%; border-radius:12px;">
  <div id="timerNumber" style="font-size:40px; font-weight:bold; color:#ff4b2b; margin:10px 0;">3</div>
  <button id="nextBtn" onclick="goNext(3)" disabled>기부 참여하기</button>
</div>

<div id="step3" class="step">
  <h2>기부 온도계</h2>
  <div class="thermometer-wrapper">
    <div class="cheer-bubble">배려의 온도가 올라가고 있어요! ❤️</div>
    <div class="marks">
        <div style="position:relative;">100<div class="mark-line-long"></div></div>
        <div style="position:relative;">80<div class="mark-line-long"></div></div>
        <div style="position:relative;">60<div class="mark-line-long"></div></div>
        <div style="position:relative;">40<div class="mark-line-long"></div></div>
        <div style="position:relative;">20<div class="mark-line-long"></div></div>
        <div style="position:relative;">0<div class="mark-line-long"></div></div>
    </div>
    <div id="thermoGroup3">
      <div class="thermometer-container"><div id="bar3" class="thermo-bar"></div></div>
      <div id="bulbText3" class="thermo-bulb">0%</div>
    </div>
    <div class="icon-cloud2">☁️</div><div class="icon-car">🚗</div><div class="icon-heart">❤️</div><div class="icon-star">⭐</div>
  </div>
  <div id="status3" class="status-text">현황 불러오는 중...</div>
  <div class="slogan-banner">한국도로공사 대구경북본부가<br>여러분의 안전운전을 진심으로 응원합니다!</div>
  <div class="question-text">기부하시겠습니까?</div>
  <div class="btn-group">
    <button onclick="handleDonate()">네 좋아요 ></button>
    <button class="btn-no" onclick="goNext(6)">아니요 ></button>
  </div>
</div>

<div id="step4" class="step">
  <h2 id="step4Title">기부 진행 중...</h2>
  <div class="thermometer-wrapper">
    <div id="thermoGroup4">
      <div class="thermometer-container"><div id="bar4" class="thermo-bar"></div></div>
      <div id="bulbText4" class="thermo-bulb">0%</div>
    </div>
  </div>
  <p id="amountText" class="status-text">처리 중...</p>
  <button id="scratchBtn" onclick="goNext(5)" style="display:none; margin-top:20px;">럭키 스크래치 확인</button>
</div>

<div id="step5" class="step">
  <h2>럭키 스크래치</h2>
  <p>회색 부분을 슥슥 긁어주세요!</p>
  <canvas id="scratch" width="300" height="150"></canvas>
  <div id="resultBox" style="display:none; margin-top:20px;">
    <div id="resultText" style="background:#fff; border:2px dashed #ff4b2b; padding:15px; border-radius:10px; margin-top:20px; font-size:15px; line-height:1.6; text-align:left;"></div>
    <button id="giftNextBtn" onclick="goNext(6)" style="margin-top:20px; display:none;">참여 완료 ></button>
    <button id="certBtn" onclick="alert('인증서 확인')" style="margin-top:15px; display:none; background:#0047a0; padding:18px; color:white; border-radius:10px; width:100%; border:none; font-weight:bold;">인증서 확인하기 ></button>
  </div>
</div>

<div id="step6" class="step">
  <img src="safety_bye.jpg" style="width:80%; border-radius:20px; margin-top:40px;">
  <div id="finalThanks" style="font-size:20px; font-weight:bold; color:#0047a0; margin-top:30px;">안전운전이 최고의 배려입니다!<br>오늘도 기분 좋은 운행 되세요.</div>
  <button onclick="location.reload()" style="margin-top:40px; background:#666;">처음으로</button>
</div>

<script>
var API_URL = "https://script.google.com/macros/s/AKfycbzhvvHx7dNpp456FfiECPtMRqYA95X1gea8cFlS0n248xzUfp9z8NfP67ff19Eaw-EPnA/exec"; 
var GOAL_AMOUNT = 10000000; 

window.onload = function() {
  fetch(API_URL).then(r => r.text()).then(t => {
    var amount = Number(t);
    if (amount >= GOAL_AMOUNT) {
      goNext(0);
      document.getElementById("step0Title").innerText = "캠페인 종료 안내";
      document.getElementById("step0Msg").innerHTML = "<b>목표 기부금이 모두 달성되었습니다.</b><br>감사합니다!";
      return;
    }
    if (localStorage.getItem("lastParticipatedDate") === new Date().toLocaleDateString()) {
      goNext(0);
      document.getElementById("step0Title").innerText = "참여 완료 안내";
      document.getElementById("step0Msg").innerHTML = "<b>이미 기부에 동참하셨습니다.</b>";
    }
  });
}

function goNext(n) {
  var steps = document.getElementsByClassName('step');
  for (var i = 0; i < steps.length; i++) { steps[i].classList.remove('active'); }
  document.getElementById('step' + n).classList.add('active');
  if (n === 2) startTimer();
  if (n === 3) refreshStatus();
  if (n === 5) initScratch();
  window.scrollTo(0,0);
}

function refreshStatus() {
  document.getElementById("thermoGroup3").classList.add("thermo-group-blinking");
  fetch(API_URL).then(r => r.text()).then(t => {
    var amount = Number(t);
    document.getElementById("status3").innerText = Math.floor(amount / 500) + "명 참여 / " + amount.toLocaleString() + "원 적립";
    setTimeout(() => {
      document.getElementById("thermoGroup3").classList.remove("thermo-group-blinking");
      updateVerticalBar("bar3", amount, "bulbText3");
    }, 800);
  });
}

function handleDonate() {
  localStorage.setItem("lastParticipatedDate", new Date().toLocaleDateString());
  goNext(4);
  document.getElementById("thermoGroup4").classList.add("thermo-group-blinking");
  fetch(API_URL, { method: "POST", body: new URLSearchParams({ type: "DONATE" }) })
  .then(res => res.text())
  .then(data => {
    var total = data.split('|')[1];
    setTimeout(() => {
      document.getElementById("thermoGroup4").classList.remove("thermo-group-blinking");
      document.getElementById("step4Title").innerText = "기부 완료!";
      document.getElementById("amountText").innerText = Number(total).toLocaleString() + "원 적립 완료!";
      document.getElementById("scratchBtn").style.display = "block";
      updateVerticalBar("bar4", total, "bulbText4"); 
    }, 1500);
  });
}

function updateVerticalBar(barId, amount, bulbId) {
  var bar = document.getElementById(barId);
  var per = Math.min(Math.max((amount / GOAL_AMOUNT) * 100, 0), 100);
  if(bar) bar.style.height = per + "%";
  var bulb = document.getElementById(bulbId);
  if(bulb) bulb.innerText = per.toFixed(1) + "%";
}

function startTimer() {
  var time = 3;
  var interval = setInterval(function() {
    time--;
    if (time > 0) document.getElementById("timerNumber").innerText = time;
    else { clearInterval(interval); document.getElementById("timerNumber").innerText = "✓"; document.getElementById("nextBtn").disabled = false; }
  }, 1000);
}

function initScratch() {
  var cvs = document.getElementById("scratch"), ctx = cvs.getContext("2d");
  var resBox = document.getElementById("resultBox"), resTxt = document.getElementById("resultText");
  var certBtn = document.getElementById("certBtn"), giftBtn = document.getElementById("giftNextBtn");
  var drawing = false, revealed = false;
  ctx.fillStyle = "#aaa"; ctx.fillRect(0, 0, 300, 150);
  ctx.fillStyle = "#fff"; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("슥슥 긁어보세요!", 150, 85);
  function checkReveal() {
    if (revealed) return;
    var pix = ctx.getImageData(0,0,300,150).data, t = 0;
    for (var i=3; i<pix.length; i+=4) if(pix[i] === 0) t++;
    if ((t/(300*150)) > 0.5) {
      revealed = true;
      var rand = Math.random() * 100;
      var type = (rand <= 10) ? "WIN" : (rand <= 55 ? "DOUBLE" : "HERO");
      ctx.globalCompositeOperation = "source-over"; ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, 300, 150);
      ctx.fillStyle = "#0047a0"; ctx.font = "bold 18px sans-serif"; resBox.style.display = "block";
      if (type === "WIN") {
        ctx.fillText("★ 커피 쿠폰 당첨 ★", 150, 85);
        resTxt.innerHTML = "<b>축하합니다! 커피 쿠폰 당첨!</b>";
        var phone = prompt("🎁 당첨! 커피 쿠폰 발송용 연락처를 입력하세요.");
        if (phone) fetch(API_URL, { method: "POST", body: new URLSearchParams({ type: "PHONE", phone: phone, resultType: "WIN" }) });
        giftBtn.style.display = "block";
      } else if (type === "DOUBLE") {
        ctx.fillText("기부금 2배 적립 당첨!", 150, 85);
        resTxt.innerHTML = "<b>기부금 2배 적립!</b><br>대구경북본부가 500원을 추가 적립합니다!";
        fetch(API_URL, { method: "POST", body: new URLSearchParams({ type: "PHONE", phone: "자동적립", resultType: "DOUBLE" }) });
        giftBtn.style.display = "block";
      } else {
        ctx.fillText("베스트 배려운전자 선정!", 150, 85);
        resTxt.innerHTML = "<b>당신은 도로 위의 영웅입니다!</b>";
        fetch(API_URL, { method: "POST", body: new URLSearchParams({ type: "PHONE", phone: "인증서발급", resultType: "HERO" }) });
        certBtn.style.display = "block";
      }
    }
  }
  function scratch(e) {
    if (!drawing || revealed) return;
    var r = cvs.getBoundingClientRect();
    var cx = e.touches ? e.touches[0].clientX : e.clientX, cy = e.touches ? e.touches[0].clientY : e.clientY;
    ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath(); ctx.arc(cx - r.left, cy - r.top, 20, 0, Math.PI * 2); ctx.fill();
    checkReveal();
  }
  cvs.addEventListener("mousedown", () => drawing = true);
  cvs.addEventListener("mousemove", scratch);
  window.addEventListener("mouseup", () => drawing = false);
  cvs.addEventListener("touchstart", (e) => { drawing = true; if(e.cancelable) e.preventDefault(); }, {passive:false});
  cvs.addEventListener("touchmove", (e) => { scratch(e); if(e.cancelable) e.preventDefault(); }, {passive:false});
}
</script>
</body>
</html>
