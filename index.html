<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전기뷰(Give U) 캠페인</title>
<style>
  body { margin:0; font-family: 'Pretendard', sans-serif; text-align:center; background:#f9f9f9; color: #333; }
  .step { display:none; padding:20px; max-width: 500px; margin: 0 auto; }
  .active { display:block; animation: fadeIn 0.5s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  
  h2 { color: #0047a0; margin-bottom: 20px; }
  button { 
    padding:15px 25px; font-size:18px; margin-top:20px; width: 100%;
    border: none; border-radius: 8px; background: #0047a0; color: white; font-weight: bold;
    cursor: pointer; transition: background 0.3s;
  }
  button:disabled { background: #ccc; cursor: not-allowed; }
  
  /* 이미지 및 홍보물 */
  .safety-img { width:100%; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }

  /* 기부 온도계 (애니메이션 추가) */
  .bar-wrap { width:100%; margin:30px auto; border:1px solid #ddd; height:35px; border-radius: 20px; overflow: hidden; background: #eee; }
  .bar { height:100%; width:0%; background: linear-gradient(90deg, #ff4b2b, #ff416c); transition: width 1.5s ease-out; }
  #amountText { font-size: 24px; font-weight: bold; color: #ff4b2b; margin-top: 10px; }

  /* 스크래치 */
  canvas { border:2px solid #ddd; margin-top:20px; touch-action: none; border-radius: 10px; background-color: #fff; }
</style>
</head>
<body>

<div id="step1" class="step active">
  <h2>안전기뷰(Give U)</h2>
  <p>잠시 쉬며 안전을 충전하세요!<br>캠페인에 참여하시면 기부금이 전달됩니다.</p>
  <button onclick="next(2)">캠페인 참여하기</button>
</div>

<div id="step2" class="step">
  <h2>안전운전 약속하기</h2>
  <img src="safety.jpg" class="safety-img" alt="배려운전 12대 수칙">
  <p style="font-size: 0.9em; color: #666; margin-top: 10px;">수칙을 3초간 확인해 주세요.</p>
  <button id="nextBtn" onclick="next(3)" disabled>확인했습니다</button>
</div>

<div id="step3" class="step">
  <h2>안전 나눔</h2>
  <p>확인 버튼을 누르면 <strong>안전드림 커피</strong> 기금으로<br>500원이 자동으로 기부됩니다.</p>
  <button onclick="donate()">기부하고 복권 받기</button>
</div>

<div id="step4" class="step">
  <h2>기부 완료!</h2>
  <p>우리의 안전한 마음이 이만큼 모였습니다.</p>
  <div class="bar-wrap">
    <div id="bar" class="bar"></div>
  </div>
  <p id="amountText">0원</p>
  <button onclick="next(5)">럭키 스크래치 확인</button>
</div>

<div id="step5" class="step">
  <h2>안전드림 럭키 스크래치</h2>
  <p>회색 부분을 긁어서 결과를 확인하세요!</p>
  <canvas id="scratch" width="300" height="150"></canvas>
  <h3 id="resultDisplay" style="margin-top: 20px; font-size: 24px; color: #0047a0;"></h3>
</div>

<script>
const API_URL = "여기에_AppsScript_URL"; // 실제 주소로 변경 필수
let resultValue = "LOSE";

function next(n){
  document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
  document.getElementById('step'+n).classList.add('active');
  
  if(n === 2) {
    setTimeout(() => { document.getElementById("nextBtn").disabled = false; }, 3000);
  }
  if(n === 5) { initScratch(); }
}

async function donate(){
  try {
    const response = await fetch(API_URL, {
      method: "POST",
      body: new URLSearchParams({ phone: "user_" + Date.now() })
    });
    const data = await response.text();

    if(data === "DUPLICATE"){
      alert("이미 참여하신 기기입니다.");
      return;
    }

    // 결과 저장 (WIN 또는 LOSE)
    resultValue = data.split('|')[0] || data; 
    // 전체 누적 금액 (서버에서 넘겨준다고 가정, 예: "WIN|50500")
    const totalAmount = data.split('|')[1] || (Number(localStorage.getItem("totalDonation") || 0) + 500);
    
    localStorage.setItem("totalDonation", totalAmount);
    updateBar(totalAmount);
    next(4);
  } catch (e) {
    alert("연결에 실패했습니다. 다시 시도해주세요.");
  }
}

function updateBar(amount) {
  const bar = document.getElementById("bar");
  const amountText = document.getElementById("amountText");
  const goal = 10000000; // 목표액
  const finalPercent = Math.min((amount / goal) * 100, 100);

  // 1. 게이지가 끝까지 확 차오르는 '풀 충전' 효과
  bar.style.transition = "width 0.5s ease-in"; 
  bar.style.width = "100% ";
  bar.style.filter = "brightness(1.5) blur(1px)"; // 빛나는 효과 추가

  // 2. 잠시 후 현재 기부 수치로 돌아오며 깜박거림
  setTimeout(() => {
    bar.style.transition = "width 1s ease-out";
    bar.style.width = finalPercent + "%";
    bar.style.filter = "none";
    
    // 수치 텍스트 업데이트
    amountText.innerText = Number(amount).toLocaleString() + "원";

    // 3. 현재 수치에서 깜박거리는 애니메이션 추가
    bar.animate([
      { opacity: 1 },
      { opacity: 0.5 },
      { opacity: 1 }
    ], {
      duration: 500,
      iterations: 3 // 3번 깜박임
    });
  }, 600);
}

function initScratch(){
  const canvas = document.getElementById("scratch");
  const ctx = canvas.getContext("2d");
  const display = document.getElementById("resultDisplay");
  let isDrawing = false;
  let lastX = 0;
  let lastY = 0;

  display.innerText = "";

  // 1. 초기 덮개 설정
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#aaaaaa";
  ctx.fillRect(0,0,300,150);
  
  // 안내 문구 추가
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 20px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("여기를 슥슥 긁어보세요!", 150, 85);

  // 2. 부드러운 긁기 함수 (선을 연결하는 방식)
  function scratch(x, y) {
    ctx.globalCompositeOperation = "destination-out";
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.lineWidth = 40; // 👈 원 크기를 40으로 키웠습니다. (기존 15~24에서 대폭 상향)

    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(x, y);
    ctx.stroke();

    lastX = x;
    lastY = y;
    
    // 결과 텍스트 노출
    display.innerText = (resultValue === "WIN") ? "🎁 당첨! 안전드림 커피" : "🙏 다음 기회에!";
  }

  // 3. 이벤트 리스너 통합 (마우스 & 터치)
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: clientX - rect.left,
      y: clientY - rect.top
    };
  }

  const start = (e) => {
    isDrawing = true;
    const pos = getPos(e);
    lastX = pos.x;
    lastY = pos.y;
  };

  const move = (e) => {
    if (!isDrawing) return;
    e.preventDefault();
    const pos = getPos(e);
    scratch(pos.x, pos.y);
  };

  const stop = () => { isDrawing = false; };

  // 마우스 이벤트
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", stop);

  // 터치 이벤트 (모바일용)
  canvas.addEventListener("touchstart", start, { passive: false });
  canvas.addEventListener("touchmove", move, { passive: false });
  canvas.addEventListener("touchend", stop);
}
</script>
</body>
</html>
