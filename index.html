<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전기뷰(Give U) 캠페인</title>
<style>
  body { margin:0; font-family: sans-serif; text-align:center; background:#f9f9f9; color: #333; overflow-x: hidden; }
  .step { display:none; padding:20px; max-width: 500px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; }
  .active { display:block; }
  
  #step1 { display: none; padding: 0; background-color: #FDF3D0; position: relative; height: auto; min-height: 100vh; }
  #step1.active { display: flex; flex-direction: column; align-items: center; }
  .intro-poster { width: 100%; max-width: 500px; height: auto; display: block; margin: 0 auto; }
  #step1 button { margin: 20px auto 40px auto; width: calc(100% - 40px); max-width: 460px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }

  /* 입체 온도계 스타일 */
  .thermometer-wrapper { position: relative; width: 220px; margin: 60px auto 30px; padding-top: 20px; }
  .thermometer-container { position: relative; width: 42px; height: 240px; margin: 0 auto; background: #ffffff; border: 4px solid #ffffff; border-radius: 30px 30px 0 0; z-index: 1; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,0.35), inset 0 0 10px rgba(0,0,0,0.1); }
  .thermo-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: linear-gradient(to right, #d31027, #ff5f6d, #d31027); transition: height 1.5s cubic-bezier(0.17, 0.67, 0.83, 0.67); border-top: 2px solid rgba(255, 255, 255, 0.7); }
  .thermo-bar::before { content: ""; position: absolute; top: -10px; left: -25%; width: 150%; height: 25px; background: rgba(180, 0, 0, 0.5); border-radius: 40%; animation: slosh 2.5s infinite ease-in-out; z-index: 5; }
  @keyframes slosh { 0%, 100% { transform: translateX(-10%) scaleY(1); } 50% { transform: translateX(10%) scaleY(1.4); } }
  .thermo-bulb { width: 90px; height: 90px; background: radial-gradient(circle at 30% 30%, #ff5f6d, #d31027); border: 5px solid #ffffff; border-radius: 50%; margin: -35px auto 10px; position: relative; z-index: 2; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 17px; text-shadow: 0 1px 3px rgba(0,0,0,0.4); }
  @keyframes pulse-glow { 0%, 100% { filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.2)); opacity: 1; } 50% { filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.6)); opacity: 0.8; } }
  .thermo-group-blinking { animation: pulse-glow 0.8s infinite ease-in-out; }
  .marks { position: absolute; right: 145px; top: 15px; height: 240px; display: flex; flex-direction: column; justify-content: space-between; font-size: 13px; font-weight: bold; color: #888; text-align: right; width: 40px; }
  .mark-line-long { position: absolute; right: -25px; width: 15px; height: 2px; background: #ddd; }

  /* [핵심] 이미지 가로 꽉 차고 가운데 정렬 */
  .full-width-center-img { 
    width: 100vw; 
    max-width: 500px; /* 모바일 폭 제한 */
    height: auto; 
    display: block; 
    margin: 0 auto; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  h2 { color: #0047a0; margin-top: 10px; font-size: 20px; word-break: keep-all; }
  .status-text { font-size: 22px; font-weight: bold; color: #000; margin: 10px 0; }
  .slogan-banner { background: #eef4ff; color: #0047a0; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: bold; margin: 0 auto 15px auto; border-left: 5px solid #0047a0; display: inline-block; width: 90%; line-height: 1.4; }
  button { padding: 18px 25px; font-size: 18px; width: 100%; border: none; border-radius: 10px; background: #244aa1; color: white; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
  canvas { border:2px solid #ddd; margin-top:20px; border-radius: 10px; background:#fff; touch-action: none; }
</style>
</head>
<body>

<div id="step0" class="step">
  <img src="safety_bye.jpg" class="full-width-center-img">
  <div id="step0Title" style="font-size:22px; font-weight:bold; color:#852722; margin-top:30px;">안내</div>
  <p id="step0Msg" style="font-size:18px; color:#333; margin-top:15px; line-height:1.6; word-break:keep-all;"></p>
  <button onclick="localStorage.removeItem('lastParticipatedDate'); location.reload();" 
          style="margin-top:50px; background:#aaaaaa; font-size:13px; padding:10px 15px; width:auto; border-radius:5px;">테스트용 초기화</button>
</div>

<div id="step1" class="step active">
  <img src="intro.png" class="intro-poster">
  <button onclick="goNext(2)">캠페인 참여하기</button>
</div>

<div id="step2" class="step">
  <h2>배려운전이 안전운전의 시작입니다.</h2>
  <img src="safety.jpg" style="width:100%; border-radius:12px;">
  <div id="timerNumber" style="font-size:40px; font-weight:bold; color:#ff4b2b; margin:10px 0;">5</div>
  <button id="nextBtn" onclick="goNext(3)" disabled>기부 참여하기</button>
</div>

<div id="step3" class="step">
  <h2>기부 온도계</h2>
  <div class="thermometer-wrapper">
    <div id="thermoGroup3"><div class="thermometer-container"><div id="bar3" class="thermo-bar"></div></div><div id="bulbText3" class="thermo-bulb">0%</div></div>
    <div class="marks">
        <div style="position:relative;">100<div class="mark-line-long"></div></div>
        <div style="position:relative;">80<div class="mark-line-long"></div></div>
        <div style="position:relative;">60<div class="mark-line-long"></div></div>
        <div style="position:relative;">40<div class="mark-line-long"></div></div>
        <div style="position:relative;">20<div class="mark-line-long"></div></div>
        <div style="position:relative;">0<div class="mark-line-long"></div></div>
    </div>
  </div>
  <div id="status3" class="status-text">현황 불러오는 중...</div>
  <div class="slogan-banner">한국도로공사 대구경북본부가<br>여러분의 안전운전을 응원합니다!</div>
  <div style="display:flex; gap:10px;">
    <button onclick="handleDonate()">네 좋아요 ></button>
    <button style="background:#fff; color:#333; border:2px solid #333;" onclick="goNext(6)">아니요 ></button>
  </div>
</div>

<div id="step4" class="step">
  <h2 id="step4Title">기부 진행 중...</h2>
  <div class="thermometer-wrapper">
    <div id="thermoGroup4"><div class="thermometer-container"><div id="bar4" class="thermo-bar"></div></div><div id="bulbText4" class="thermo-bulb">0%</div></div>
  </div>
  <p id="amountText" class="status-text">처리 중...</p>
  <button id="scratchBtn" onclick="goNext(5)" style="display:none; margin-top:20px;">럭키 스크래치 확인</button>
</div>

<div id="step5" class="step">
  <h2>럭키 스크래치</h2>
  <p>회색 부분을 슥슥 긁어주세요!</p>
  <canvas id="scratch" width="300" height="150"></canvas>
  <div id="resultBox" style="display:none; margin-top:20px;">
    <div id="resultText" style="background:#fff; border:2px dashed #ff4b2b; padding:15px; border-radius:10px; text-align:left; line-height:1.6;"></div>
    <button id="giftNextBtn" onclick="goNext(6)" style="margin-top:20px; display:none;">참여 완료 ></button>
  </div>
</div>

<div id="step6" class="step">
  <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh;">
    <img src="safety_bye.jpg" class="full-width-center-img">
    <div id="finalThanks" style="font-size:20px; font-weight:bold; color:#0047a0; margin-top:30px; word-break: keep-all;">
      안전운전이 최고의 배려입니다!<br>오늘도 기분 좋은 운행 되세요.
    </div>
    <button onclick="location.reload()" style="margin-top:40px; background:#666; width: 200px;">처음으로</button>
  </div>
</div>

<script>
var API_URL = "https://script.google.com/macros/s/AKfycbw7HZRTLdytiZiYnOIGHwq5OoL1bHG7MeX4OFgDCyZ4cljC7dXabmqq0bJIgACiKNrcIQ/exec"; 
var GOAL_AMOUNT = 10000000; 
var canWinSticker = false; 

window.onload = function() {
  fetch(API_URL).then(r => r.text()).then(t => {
    var data = t.split('|');
    var amount = Number(data[0]);
    canWinSticker = (data[1] === "true");

    if (amount >= GOAL_AMOUNT) {
      goNext(0);
      document.getElementById("step0Title").innerText = "캠페인 종료";
      document.getElementById("step0Msg").innerHTML = "기부 목표 달성으로 종료되었습니다.";
      return;
    }
    if (localStorage.getItem("lastParticipatedDate") === new Date().toLocaleDateString()) {
      goNext(0);
      document.getElementById("step0Title").innerText = "참여 완료";
      document.getElementById("step0Msg").innerHTML = "이미 참여하셨습니다. 안전운전하세요!";
    }
  });
}

function goNext(n) {
  var steps = document.getElementsByClassName('step');
  for (var i = 0; i < steps.length; i++) { steps[i].classList.remove('active'); }
  document.getElementById('step' + n).classList.add('active');
  if (n === 2) startTimer();
  if (n === 3) refreshStatus();
  if (n === 5) initScratch();
  window.scrollTo(0,0);
}

function refreshStatus() {
  document.getElementById("thermoGroup3").classList.add("thermo-group-blinking");
  fetch(API_URL).then(r => r.text()).then(t => {
    var amount = Number(t.split('|')[0]);
    document.getElementById("status3").innerText = Math.floor(amount / 500) + "명 참여 / " + amount.toLocaleString() + "원 적립";
    setTimeout(() => {
      document.getElementById("thermoGroup3").classList.remove("thermo-group-blinking");
      updateVerticalBar("bar3", amount, "bulbText3");
    }, 800);
  });
}

function handleDonate() {
  localStorage.setItem("lastParticipatedDate", new Date().toLocaleDateString());
  goNext(4);
  document.getElementById("thermoGroup4").classList.add("thermo-group-blinking");
  fetch(API_URL, { method: "POST", body: new URLSearchParams({ type: "DONATE" }) })
  .then(res => res.text())
  .then(data => {
    var total = data.split('|')[1];
    setTimeout(() => {
      document.getElementById("thermoGroup4").classList.remove("thermo-group-blinking");
      document.getElementById("step4Title").innerText = "기부 완료!";
      document.getElementById("amountText").innerText = Number(total).toLocaleString() + "원 적립!";
      document.getElementById("scratchBtn").style.display = "block";
      updateVerticalBar("bar4", total, "bulbText4"); 
    }, 1200);
  });
}

function updateVerticalBar(barId, amount, bulbId) {
  var per = Math.min(Math.max((amount / GOAL_AMOUNT) * 100, 0), 100);
  document.getElementById(barId).style.height = per + "%";
  document.getElementById(bulbId).innerText = per.toFixed(1) + "%";
}

function startTimer() {
  var time = 3;
  var interval = setInterval(function() {
    time--;
    if (time > 0) document.getElementById("timerNumber").innerText = time;
    else { clearInterval(interval); document.getElementById("timerNumber").innerText = "✓"; document.getElementById("nextBtn").disabled = false; }
  }, 1000);
}

function initScratch() {
  var cvs = document.getElementById("scratch"), ctx = cvs.getContext("2d");
  var resBox = document.getElementById("resultBox"), resTxt = document.getElementById("resultText");
  var giftBtn = document.getElementById("giftNextBtn");
  var drawing = false, revealed = false;

  ctx.fillStyle = "#aaa"; ctx.fillRect(0, 0, 300, 150);
  ctx.fillStyle = "#fff"; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("슥슥 긁어보세요!", 150, 85);

  function checkReveal() {
    if (revealed) return;
    var pix = ctx.getImageData(0,0,300,150).data, t = 0;
    for (var i=3; i<pix.length; i+=4) if(pix[i] === 0) t++;
    if ((t/(300*150)) > 0.5) {
      revealed = true;
      var rand = Math.random() * 100;
      var type = "";

      if (canWinSticker && rand <= 15) type = "STICKER"; 
      else if (rand <= 60) type = "DOUBLE"; 
      else type = "LOSE"; 

      ctx.globalCompositeOperation = "source-over"; ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, 300, 150);
      ctx.fillStyle = "#0047a0"; ctx.font = "bold 18px sans-serif"; resBox.style.display = "block";

      if (type === "STICKER") {
        ctx.fillText("★ 왕눈이 스티커 당첨 ★", 150, 85);
        resTxt.innerHTML = "<b>축하합니다! 왕눈이 스티커 당첨!</b><br>현장 직원에게 이 화면을 보여주세요.";
        var phone = prompt("당첨 확인을 위해 연락처를 입력해주세요.");
        fetch(API_URL, { method: "POST", body: new URLSearchParams({ type: "PHONE", phone: phone, resultType: "STICKER" }) });
        giftBtn.style.display = "block";
      } else if (type === "DOUBLE") {
        ctx.fillText("기부금 2배 적립!", 150, 85);
        resTxt.innerHTML = "<b>기부금 2배 적립 당첨!</b><br>대구경북본부가 500원을 추가 기부합니다.";
        fetch(API_URL, { method: "POST", body: new URLSearchParams({ type: "PHONE", phone: "자동적립", resultType: "DOUBLE" }) });
        giftBtn.style.display = "block";
      } else {
        ctx.fillText("아쉽지만 다음 기회에!", 150, 85);
        resTxt.innerHTML = "<b>아쉽지만 꽝입니다!</b><br>비록 당첨은 안 되었지만, 여러분의 따뜻한 마음은 잘 전달되었습니다.";
        fetch(API_URL, { method: "POST", body: new URLSearchParams({ type: "PHONE", phone: "꽝", resultType: "LOSE" }) });
        giftBtn.style.display = "block";
      }
    }
  }

  function scratch(e) {
    if (!drawing || revealed) return;
    var r = cvs.getBoundingClientRect();
    var cx = e.touches ? e.touches[0].clientX : e.clientX, cy = e.touches ? e.touches[0].clientY : e.clientY;
    ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath(); ctx.arc(cx - r.left, cy - r.top, 20, 0, Math.PI * 2); ctx.fill();
    checkReveal();
  }
  cvs.addEventListener("mousedown", () => drawing = true);
  cvs.addEventListener("mousemove", scratch);
  window.addEventListener("mouseup", () => drawing = false);
  cvs.addEventListener("touchstart", (e) => { drawing = true; if(e.cancelable) e.preventDefault(); }, {passive:false});
  cvs.addEventListener("touchmove", (e) => { scratch(e); if(e.cancelable) e.preventDefault(); }, {passive:false});
}
</script>
</body>
</html>
