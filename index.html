<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전기뷰(Give U) 캠페인</title>
<style>
  body { margin:0; font-family: sans-serif; text-align:center; background:#f9f9f9; color: #333; overflow-x: hidden; }
  .step { display:none; padding:20px; max-width: 500px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; }
  .active { display:block; animation: fadeIn 0.5s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  
  h2 { color: #0047a0; margin-bottom: 20px; }
  button { 
    padding:15px 25px; font-size:18px; margin-top:20px; width: 100%;
    border: none; border-radius: 8px; background: #0047a0; color: white; font-weight: bold;
    cursor: pointer; transition: background 0.3s;
    /* 모바일 클릭 반응성 향상 */
    -webkit-tap-highlight-color: transparent;
  }
  button:disabled { background: #ccc; cursor: not-allowed; }
  
  .safety-img { width:100%; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }

  /* 기부 온도계 */
  .bar-wrap { width:100%; margin:30px auto; border:1px solid #ddd; height:35px; border-radius: 20px; overflow: hidden; background: #eee; position: relative; }
  .bar {
    height:100%; width:0%;
    background: linear-gradient(90deg, #ff4b2b, #ff416c);
    box-shadow: 0 0 15px rgba(255, 75, 43, 0.7);
    position: absolute; left: 0; top: 0;
  }
  #amountText { font-size: 24px; font-weight: bold; color: #ff4b2b; margin-top: 10px; }

  /* 스크래치 */
  canvas { border:2px solid #ddd; margin-top:20px; touch-action: none; border-radius: 10px; background-color: #fff; }
  #resultDisplay { 
    pointer-events: none; /* 중요: 클릭 이벤트 방해 금지 */
    margin-top: 20px; 
    font-size: 22px; 
    color: #0047a0; 
    min-height: 110px; 
    font-weight: bold; 
  }
</style>
</head>
<body>

<div id="step1" class="step active">
  <h2>안전기뷰(Give U)</h2>
  <p>잠시 쉬며 안전을 충전하세요!<br>캠페인에 참여하시면 기부금이 전달됩니다.</p>
  <button onclick="next(2)">캠페인 참여하기</button>
</div>

<div id="step2" class="step">
  <h2>안전운전 약속하기</h2>
  <img src="safety.jpg" class="safety-img" alt="배려운전 12대 수칙">
  <p style="font-size: 0.9em; color: #666; margin-top: 10px;">수칙을 3초간 확인해 주세요.</p>
  <button id="nextBtn" onclick="next(3)" disabled>확인했습니다</button>
</div>

<div id="step3" class="step">
  <h2>안전 나눔</h2>
  <p>확인 버튼을 누르면 <strong>안전드림 커피</strong> 기금으로<br>500원이 자동으로 기부됩니다.</p>
  <button onclick="donate()">기부하고 복권 받기</button>
</div>

<div id="step4" class="step">
  <h2>기부 완료!</h2>
  <p>우리의 안전한 마음이 이만큼 모였습니다.</p>
  <div class="bar-wrap">
    <div id="bar" class="bar"></div>
  </div>
  <p id="amountText">0원</p>
  <button onclick="next(5)">럭키 스크래치 확인</button>
</div>

<div id="step5" class="step">
  <h2>안전드림 럭키 스크래치</h2>
  <p>회색 부분을 긁어서 결과를 확인하세요!</p>
  <canvas id="scratch" width="300" height="150"></canvas>
  <div id="resultDisplay"></div>
</div>

<script>
// [필수] Apps Script URL을 따옴표 안에 넣으세요.
const API_URL = "여기에_AppsScript_URL"; 
let resultValue = "LOSE";

function next(n){
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  const target = document.getElementById('step' + n);
  if(target) target.classList.add('active');
  
  if(n === 2) {
    setTimeout(() => { 
      const btn = document.getElementById("nextBtn");
      if(btn) btn.disabled = false; 
    }, 3000);
  }
  if(n === 5) { initScratch(); }
}

async function donate(){
  try {
    const response = await fetch(API_URL, {
      method: "POST",
      body: new URLSearchParams({ phone: "user_" + Date.now() })
    });
    const data = await response.text();

    if(data === "DUPLICATE"){
      alert("이미 참여하셨습니다.");
      return;
    }

    resultValue = data.split('|')[0] || data; 
    const totalAmount = data.split('|')[1] || (Number(localStorage.getItem("totalDonation") || 0) + 500);
    
    localStorage.setItem("totalDonation", totalAmount);
    updateBar(totalAmount);
    next(4);
  } catch (e) {
    // 서버 연결 실패 시 테스트를 위해 강제 진행
    const current = (Number(localStorage.getItem("totalDonation") || 0) + 500);
    localStorage.setItem("totalDonation", current);
    updateBar(current);
    next(4);
  }
}

function updateBar(amount) {
  const bar = document.getElementById("bar");
  const amountText = document.getElementById("amountText");
  const goal = 10000000; 
  const finalPercent = Math.min((amount / goal) * 100, 100);

  bar.style.transition = "width 0.4s ease-in";
  bar.style.width = "100%";
  
  setTimeout(() => {
    bar.style.transition = "width 1.2s ease-in-out";
    bar.style.width = finalPercent + "%";
    amountText.innerText = Number(amount).toLocaleString() + "원";
    
    setTimeout(() => {
      let count = 0;
      const blink = setInterval(() => {
        bar.style.opacity = (bar.style.opacity === "0.3") ? "1" : "0.3";
        if (++count >= 6) { clearInterval(blink); bar.style.opacity = "1"; }
      }, 150);
    }, 1100);
  }, 600);
}

    if (revealed) return;
    const pixels = ctx.getImageData(0, 0, 300, 150).data;
    let trans = 0;
    for (let i = 3; i < pixels.length; i += 4) { if (pixels[i] === 0) trans++; }
    
    if ((trans / (300 * 150)) > 0.5) {
      revealed = true;
      const res = (resultValue === "WIN") ? "🎁 당첨! 안전드림 커피" : "🙏 다음 기회에!";
      display.innerHTML = `<div>${res}</div>`;
      display.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 500, fill: 'forwards' });

      setTimeout(() => {
        const safety = document.createElement("div");
        safety.innerHTML = "<div style='color:#ff4b2b; margin-top:12px;'>❤️ 오늘도 안전운행 하세요! ❤️</div>";
        display.appendChild(safety);
        safety.animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 800, fill: 'forwards' });
      }, 3000);
    }
  }
