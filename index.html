<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전기뷰(Give U) 캠페인</title>
<style>
  body { margin:0; font-family: 'Pretendard', sans-serif; text-align:center; background:#f9f9f9; color: #333; }
  .step { display:none; padding:20px; max-width: 500px; margin: 0 auto; }
  .active { display:block; animation: fadeIn 0.5s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  
  h2 { color: #0047a0; margin-bottom: 20px; }
  button { 
    padding:15px 25px; font-size:18px; margin-top:20px; width: 100%;
    border: none; border-radius: 8px; background: #0047a0; color: white; font-weight: bold;
    cursor: pointer; transition: background 0.3s;
  }
  button:disabled { background: #ccc; cursor: not-allowed; }
  
  .safety-img { width:100%; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }

  .bar-wrap { width:100%; margin:30px auto; border:1px solid #ddd; height:35px; border-radius: 20px; overflow: hidden; background: #eee; }
  .bar {
    height:100%; width:0%;
    background: linear-gradient(90deg, #ff4b2b, #ff416c);
    box-shadow: 0 0 15px rgba(255, 75, 43, 0.7);
  }
  #amountText { font-size: 24px; font-weight: bold; color: #ff4b2b; margin-top: 10px; }

  canvas { border:2px solid #ddd; margin-top:20px; touch-action: none; border-radius: 10px; background-color: #fff; }
</style>
</head>
<body>

<div id="step1" class="step active">
  <h2>안전기뷰(Give U)</h2>
  <p>잠시 쉬며 안전을 충전하세요!<br>캠페인에 참여하시면 기부금이 전달됩니다.</p>
  <button onclick="next(2)">캠페인 참여하기</button>
</div>

<div id="step2" class="step">
  <h2>안전운전 약속하기</h2>
  <img src="safety.jpg" class="safety-img" alt="배려운전 12대 수칙">
  <p style="font-size: 0.9em; color: #666; margin-top: 10px;">수칙을 3초간 확인해 주세요.</p>
  <button id="nextBtn" onclick="next(3)" disabled>확인했습니다</button>
</div>

<div id="step3" class="step">
  <h2>안전 나눔</h2>
  <p>확인 버튼을 누르면 <strong>안전드림 커피</strong> 기금으로<br>500원이 자동으로 기부됩니다.</p>
  <button onclick="donate()">기부하고 복권 받기</button>
</div>

<div id="step4" class="step">
  <h2>기부 완료!</h2>
  <p>우리의 안전한 마음이 이만큼 모였습니다.</p>
  <div class="bar-wrap">
    <div id="bar" class="bar"></div>
  </div>
  <p id="amountText">0원</p>
  <button onclick="next(5)">럭키 스크래치 확인</button>
</div>

<div id="step5" class="step">
  <h2>안전드림 럭키 스크래치</h2>
  <p>회색 부분을 긁어서 결과를 확인하세요!</p>
  <canvas id="scratch" width="300" height="150"></canvas>
  <div id="resultDisplay" style="margin-top: 20px; font-size: 22px; color: #0047a0; min-height: 80px; font-weight: bold;"></div>
</div>

<script>
const API_URL = "여기에_AppsScript_URL"; 
let resultValue = "LOSE";

function next(n){
  document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
  document.getElementById('step'+n).classList.add('active');
  
  if(n === 2) {
    setTimeout(() => { document.getElementById("nextBtn").disabled = false; }, 3000);
  }
  if(n === 5) { initScratch(); }
}

async function donate(){
  try {
    const response = await fetch(API_URL, {
      method: "POST",
      body: new URLSearchParams({ phone: "user_" + Date.now() })
    });
    const data = await response.text();

    if(data === "DUPLICATE"){
      alert("이미 참여하신 기기입니다.");
      return;
    }

    resultValue = data.split('|')[0] || data; 
    const totalAmount = data.split('|')[1] || (Number(localStorage.getItem("totalDonation") || 0) + 500);
    
    localStorage.setItem("totalDonation", totalAmount);
    updateBar(totalAmount);
    next(4);
  } catch (e) {
    alert("연결에 실패했습니다. 다시 시도해주세요.");
  }
}

function updateBar(amount) {
  const bar = document.getElementById("bar");
  const amountText = document.getElementById("amountText");
  const goal = 10000000; 
  const finalPercent = Math.min((amount / goal) * 100, 100);

  bar.style.transition = "width 0.4s cubic-bezier(0.17, 0.67, 0.83, 0.67)";
  bar.style.width = "100%";
  
  setTimeout(() => {
    bar.style.transition = "width 1.2s ease-in-out";
    bar.style.width = finalPercent + "%";
    amountText.innerText = Number(amount).toLocaleString() + "원";
    
    setTimeout(() => {
      let blinkCount = 0;
      const blinkInterval = setInterval(() => {
        bar.style.opacity = (bar.style.opacity === "0.3") ? "1" : "0.3";
        blinkCount++;
        if (blinkCount >= 6) {
          clearInterval(blinkInterval);
          bar.style.opacity = "1";
        }
      }, 150);
    }, 1000);
  }, 600);
}

function initScratch(){
  const canvas = document.getElementById("scratch");
  const ctx = canvas.getContext("2d");
  const display = document.getElementById("resultDisplay");
  let isDrawing = false;
  let lastX = 0, lastY = 0;
  let isRevealed = false;

  display.innerHTML = ""; // 기존 내용 초기화

  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#aaaaaa";
  ctx.fillRect(0,0,300,150);
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 18px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("50% 이상 긁어보세요!", 150, 85);

  function checkScratchPercentage() {
    if (isRevealed) return;
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const pixels = imageData.data;
    let transparentPixels = 0;
    for (let i = 3; i < pixels.length; i += 4) {
      if (pixels[i] === 0) transparentPixels++;
    }
    const percentage = (transparentPixels / (canvas.width * canvas.height)) * 100;

    if (percentage > 50) {
      isRevealed = true;
      // 1. 결과 메시지 표시
      const mainText = (resultValue === "WIN") ? "🎁 당첨! 안전드림 커피" : "🙏 다음 기회에!";
      display.innerHTML = `<div>${mainText}</div>`;
      
      display.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 500, fill: 'forwards' });

      // 2. 3초 후 안전운행 메시지 추가
      setTimeout(() => {
        const safetyMsg = document.createElement("div");
        safetyMsg.innerHTML = "<div style='color:#ff4b2b; margin-top:10px;'>❤️ 오늘도 안전운행 하세요! ❤️</div>";
        display.appendChild(safetyMsg);
        safetyMsg.animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 800, fill: 'forwards' });
      }, 3000);
    }
  }

  function scratch(x, y) {
    ctx.globalCompositeOperation = "destination-out";
    ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.lineWidth = 45;
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(x, y);
    ctx.stroke();
    lastX = x; lastY = y;
    if (Math.random() > 0.9) checkScratchPercentage();
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  const start = (e) => { isDrawing = true; const pos = getPos(e); lastX = pos.x; lastY = pos.y; };
  const move = (e) => { if (!isDrawing) return; e.preventDefault(); const pos = getPos(e); scratch(pos.x, pos.y); };
  const
