<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전기뷰(Give U) 캠페인</title>
<style>
  body { margin:0; font-family: sans-serif; text-align:center; background:#f9f9f9; color: #333; overflow-x: hidden; }
  .step { display:none; padding:20px; max-width: 500px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; }
  .active { display:block; }
  
  /* [수정] 첫 화면(Step 1) 스타일: 이미지를 배경으로 꽉 차게 설정 */
  #step1 { 
    display: none; /* 기본은 숨김 */
    padding: 0; /* 패딩 제거 */
    background-image: url('intro.png'); /* 보내주신 이미지 삽입 */
    background-size: contain; /* 이미지가 잘리지 않고 전체가 다 보이도록 설정 */
    background-position: top center; /* 위쪽 중앙 기준 */
    background-repeat: no-repeat; /* 반복 없음 */
    background-color: #FDF3D0; /* 이미지 주변 여백 색상을 포스터 배경색과 통일 */
    position: relative;
  }
  #step1.active { display: flex; flex-direction: column; justify-content: flex-end; } /* 버튼을 아래쪽에 배치하기 위해 flex 사용 */

  /* [수정] 첫 화면 버튼 스타일: 포스터 하단에 겹치지 않게 여백 추가 */
  #step1 button { 
    margin: 40px 20px; /* 좌우 여백 주고 하단 포스터 내용과 띄움 */
    width: calc(100% - 40px); /* 여백 제외한 꽉 찬 너비 */
    box-shadow: 0 4px 10px rgba(0,0,0,0.2); /* 버튼 강조를 위해 그림자 추가 */
  }

  /* 나머지 스타일은 기존과 동일 */
  h2 { color: #0047a0; margin-top: 10px; }
  button { padding:18px 25px; font-size:18px; margin-top:20px; width: 100%; border: none; border-radius: 10px; background: #0047a0; color: white; font-weight: bold; cursor: pointer; transition: background 0.2s; }
  button:active { background: #003375; } /* 클릭했을 때 느낌 주기 */
  button:disabled { background: #ccc; }
  .safety-img { width:100%; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
  #timerNumber { font-size: 40px; font-weight: bold; color: #ff4b2b; margin: 10px 0; }
  .bar-wrap { width:100%; margin:30px 0; border:1px solid #ddd; height:35px; border-radius: 20px; overflow: hidden; background: #eee; position: relative; }
  .bar { height:100%; width:0%; background: linear-gradient(90deg, #ff4b2b, #ff416c); position: absolute; left: 0; top: 0; transition: width 0.8s ease-out; }
  
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
  .blinking { animation: blink 0.8s infinite; }

  #amountText { font-size: 24px; font-weight: bold; color: #ff4b2b; min-height: 40px; display: flex; align-items: center; justify-content: center; }
  canvas { border:2px solid #ddd; margin-top:20px; touch-action: none; border-radius: 10px; background:#fff; cursor: crosshair; }
  #resultDisplay { margin-top: 20px; font-size: 18px; font-weight: bold; min-height: 120px; }
  .privacy-info { font-size: 11px; color: #888; margin-top: 15px; line-height: 1.4; text-align: left; background: #eee; padding: 10px; border-radius: 5px; }
</style>
</head>
<body>

<div id="step1" class="step active">
  <button onclick="goNext(2)">캠페인 참여하기</button>
</div>

<div id="step2" class="step">
  <h2>안전운전 약속하기</h2>
  <img src="safety.jpg" class="safety-img">
  <div id="timerNumber">3</div>
  <p style="font-size: 14px; color: #666;">안전 수칙을 3초간 확인해 주세요.</p>
  <button id="nextBtn" onclick="goNext(3)" disabled>확인했습니다</button>
</div>

<div id="step3" class="step">
  <h2>안전 나눔</h2>
  <p>기부하기 버튼을 누르면<br><b>500원</b>이 자동으로 기부됩니다.</p>
  <button onclick="handleDonate()">기부하고 복권 받기</button>
</div>

<div id="step4" class="step">
  <h2>기부 완료!</h2>
  <div class="bar-wrap"><div id="bar" class="bar"></div></div>
  <p id="amountText">0원</p>
  <button onclick="goNext(5)">럭키 스크래치 확인</button>
</div>

<div id="step5" class="step">
  <h2>럭키 스크래치</h2>
  <p>회색 부분을 50% 이상 긁어주세요!</p>
  <canvas id="scratch" width="300" height="150"></canvas>
  <div id="resultDisplay"></div>
  <div class="privacy-info">
    <b>[개인정보 수집 및 이용 안내]</b><br>
    - 수집 항목: 휴대전화 번호 (당첨 시에 한함)<br>
    - 이용 목적: 경품(커피 쿠폰) 발송용<br>
    - 보유 기간: <b>경품 발송 완료 후 즉시 파기</b>
  </div>
</div>

<script>
// 배포된 Apps Script URL (차장님 URL 그대로 유지)
var API_URL = "https://script.google.com/macros/s/AKfycbyUoMPN-xEmrSakJC4zvb4SZlRcE5pytPLcwd8oIcqO2i3PiENRZ_dBHiLGYNnH2Pis6g/exec"; 

function goNext(n) {
  var steps = document.getElementsByClassName('step');
  for (var i = 0; i < steps.length; i++) { steps[i].classList.remove('active'); }
  document.getElementById('step' + n).classList.add('active');
  if (n === 2) { startTimer(); }
  if (n === 5) { initScratch(); }
}

function startTimer() {
  var time = 3;
  var btn = document.getElementById("nextBtn");
  var num = document.getElementById("timerNumber");
  btn.disabled = true;
  var interval = setInterval(function() {
    time--;
    if (time > 0) { num.innerText = time; } 
    else { clearInterval(interval); num.innerText = "✓"; num.style.color = "#0047a0"; btn.disabled = false; }
  }, 1000);
}

function handleDonate() {
  goNext(4);
  var txt = document.getElementById("amountText");
  var bar = document.getElementById("bar");
  
  txt.style.transition = "none"; txt.style.opacity = "1"; txt.style.fontSize = "16px"; txt.style.color = "#888";
  txt.innerText = "기부 현황을 불러오는 중..."; 
  bar.classList.add("blinking");

  // 낙관적 업데이트
  var lastTotal = Number(localStorage.getItem("totalDonation") || 0);
  if(lastTotal === 0) {
      fetch(API_URL).then(r=>r.text()).then(t=>{
          var cur = Number(t);
          localStorage.setItem("totalDonation", cur);
          moveBarOnly(cur + 500);
      });
  } else {
      moveBarOnly(lastTotal + 500);
  }

  fetch(API_URL, {
    method: "POST",
    body: new URLSearchParams({ type: "DONATE" })
  })
  .then(function(res) { return res.text(); })
  .then(function(data) {
    var serverTotal = data.split('|')[1];
    localStorage.setItem("totalDonation", serverTotal);
    setTimeout(function() {
      bar.classList.remove("blinking");
      txt.style.transition = "all 0.5s";
      txt.innerText = Number(serverTotal).toLocaleString() + "원";
      txt.style.fontSize = "24px"; txt.style.color = "#ff4b2b";
      moveBarOnly(serverTotal); 
    }, 800);
  });
}

function moveBarOnly(amount) {
  var bar = document.getElementById("bar");
  var goal = 10000000;
  var per = Math.min(Math.max((amount / goal) * 100, 5), 100);
  bar.style.width = per + "%";
}

function initScratch() {
  var cvs = document.getElementById("scratch");
  var ctx = cvs.getContext("2d");
  var disp = document.getElementById("resultDisplay");
  var drawing = false;
  var revealed = false;

  // 1. 회색 덮개 초기화
  ctx.globalCompositeOperation = "source-over"; 
  ctx.fillStyle = "#aaa";
  ctx.fillRect(0, 0, 300, 150);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 16px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("슥슥 긁어보세요!", 150, 85);

  function checkReveal() {
    if (revealed) return;
    var pix = ctx.getImageData(0,0,300,150).data;
    var t = 0;
    for (var i=3; i<pix.length; i+=4) { if(pix[i] === 0) t++; }
    
    if ((t/(300*150)) > 0.5) {
      revealed = true;
      disp.innerHTML = "결과 확인 중...";

      fetch(API_URL, { method: "POST", body: new URLSearchParams({ type: "SCRATCH" }) })
      .then(res => res.text())
      .then(result => {
        // 캔버스 결과 그리기
        ctx.globalCompositeOperation = "source-over"; 
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, 300, 150);
        
        ctx.fillStyle = (result === "WIN") ? "#0047a0" : "#888";
        ctx.font = "bold 40px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(result === "WIN" ? "★ 당 첨 ★" : "다음 기회에", 150, 75);

        if (result === "WIN") {
          var phone = prompt("🎁 당첨! 안전드림 커피 쿠폰 발송을 위해\n전화번호를 입력해주세요.");
          if (phone) {
            fetch(API_URL, { method: "POST", body: new URLSearchParams({ type: "PHONE", phone: phone }) });
            disp.innerHTML = "<div style='color:#0047a0;'>✅ 등록완료! 곧 발송됩니다.</div>";
          }
        } else {
          disp.innerHTML = "🙏 다음 기회에! 안전운전 하세요.";
        }
      });
    }
  }

  function getPos(e) {
    var r = cvs.getBoundingClientRect();
    var cx = e.touches ? e.touches[0].clientX : e.clientX;
    var cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: cx - r.left, y: cy - r.top };
  }

  function scratch(e) {
    if (!drawing) return;
    var p = getPos(e);
    ctx.globalCompositeOperation = "destination-out"; // 긁어내기 모드
    ctx.beginPath(); 
    ctx.arc(p.x, p.y, 20, 0, Math.PI * 2); 
    ctx.fill();
    checkReveal();
  }

  // 리스너 등록 (터치 이벤트 수동 등록으로 passive 이슈 해결)
  cvs.addEventListener("mousedown", function() { drawing = true; });
  cvs.addEventListener("mousemove", scratch);
  window.addEventListener("mouseup", function() { drawing = false; });
  cvs.addEventListener("touchstart", function(e) { drawing = true; if(e.cancelable) e.preventDefault(); }, {passive:false});
  cvs.addEventListener("touchmove", function(e) { scratch(e); if(e.cancelable) e.preventDefault(); }, {passive:false});
  cvs.addEventListener("touchend", function() { drawing = false; });
}

// 초기 온도계 로딩 (캐시된 값 있으면 사용)
window.onload = function() {
    var lastTotal = Number(localStorage.getItem("totalDonation") || 0);
    if(lastTotal > 0) {
        moveBarOnly(lastTotal);
    }
}
</script>
</body>
</html>
