<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전기뷰(Give U) 캠페인</title>
<style>
  body { margin:0; font-family: sans-serif; text-align:center; background:#f9f9f9; color: #333; overflow-x: hidden; }
  .step { display:none; padding:20px; max-width: 500px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; }
  .active { display:block; }
  
  /* Step 1: 포스터 및 버튼 배치 개선 */
  #step1 { display: none; padding: 0; background-color: #FDF3D0; position: relative; min-height: 100vh; }
  #step1.active { display: flex; flex-direction: column; align-items: center; }
  .intro-poster { width: 100%; max-width: 500px; height: auto; display: block; margin: 0 auto; }
  #step1 button { margin: 40px auto; width: calc(100% - 40px); max-width: 460px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }

  /* 입체 온도계 및 애니메이션 아이콘 복구 */
  .thermometer-wrapper { position: relative; width: 220px; margin: 60px auto 30px; padding-top: 20px; }
  .icon-cloud2 { position: absolute; right: -40px; top: 40px; font-size: 20px; opacity: 0.4; animation: float 4s infinite ease-in-out; }
  .icon-car { position: absolute; left: -60px; bottom: 80px; font-size: 30px; animation: drive 4s infinite linear; }
  .icon-heart { position: absolute; right: -45px; bottom: 120px; font-size: 22px; color: #ff416c; animation: beat 1.5s infinite; }
  .icon-star { position: absolute; left: -30px; top: 120px; font-size: 18px; color: #ffb800; animation: rotate 5s infinite linear; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes drive { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(15px); } }
  @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
  @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .cheer-bubble { position: absolute; top: -50px; left: 50%; transform: translateX(-50%); background: #e63946; color: white; padding: 8px 18px; border-radius: 25px; font-size: 14px; font-weight: bold; white-space: nowrap; z-index: 10; }
  .thermometer-container { position: relative; width: 42px; height: 240px; margin: 0 auto; background: #ffffff; border: 4px solid #ffffff; border-radius: 30px 30px 0 0; z-index: 1; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,0.35), inset 0 0 10px rgba(0,0,0,0.1); }
  .thermo-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: linear-gradient(to right, #d31027, #ff5f6d, #d31027); transition: height 1.5s cubic-bezier(0.17, 0.67, 0.83, 0.67); }
  .thermo-bar::before { content: ""; position: absolute; top: -10px; left: -25%; width: 150%; height: 25px; background: rgba(180, 0, 0, 0.5); border-radius: 40%; animation: slosh 2.5s infinite ease-in-out; }
  @keyframes slosh { 0%, 100% { transform: translateX(-10%) scaleY(1); } 50% { transform: translateX(10%) scaleY(1.4); } }
  .thermo-bulb { width: 90px; height: 90px; background: radial-gradient(circle at 30% 30%, #ff5f6d, #d31027); border: 5px solid #ffffff; border-radius: 50%; margin: -35px auto 10px; position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
  @keyframes pulse-glow { 0%, 100% { filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.2)); opacity: 1; } 50% { filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.6)); opacity: 0.8; } }
  .thermo-group-blinking { animation: pulse-glow 0.8s infinite ease-in-out; }

  /* 스크래치 영역 제어 */
  #scratchContainer { position: relative; width: 300px; height: 150px; margin: 20px auto; border-radius: 10px; overflow: hidden; border: 2px solid #ddd; background-color: #fff; background-size: cover; background-position: center; }
  canvas { position: absolute; top: 0; left: 0; touch-action: none; z-index: 5; }

  button { padding: 18px 25px; font-size: 18px; width: 100%; border: none; border-radius: 10px; background: #244aa1; color: white; font-weight: bold; cursor: pointer; }
  .btn-group { display: flex; gap: 10px; }
  .btn-no { background: #fff; color: #333; border: 2px solid #333; }
  
  .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center; }
  .modal-content { background:#fff; padding:25px; border-radius:15px; width:85%; max-width:400px; }
  .input-field { width:100%; padding:10px; margin-bottom:10px; border:1px solid #ddd; border-radius:5px; box-sizing:border-box; }
</style>
</head>
<body>

<div id="step0" class="step">
  <img src="safety_bye.jpg" style="width:80%; border-radius:20px; margin-top:40px;">
  <div id="step0Title" style="font-size:22px; font-weight:bold; color:#852722; margin-top:30px;">안내</div>
  <p id="step0Msg" style="font-size:18px; color:#333; margin-top:15px; line-height:1.6;"></p>
  <button onclick="localStorage.removeItem('participatedCampaign'); location.reload();" style="margin-top:50px; background:#aaa; font-size:13px; width:auto; padding: 10px 15px;">테스트용 초기화</button>
</div>

<div id="step1" class="step active">
  <img src="intro.png" class="intro-poster">
  <button onclick="goNext(2)">캠페인 참여하기</button>
</div>

<div id="step2" class="step">
  <h2 style="color:#0047a0;">나눔을 실천하는 당신<br>도로 위에서도 배려를 보여주세요!</h2>
  <img src="safety.jpg" style="width:100%; border-radius:12px;">
  <div id="timerNumber" style="font-size:40px; font-weight:bold; color:#ff4b2b; margin:10px 0;">5</div>
  <button id="nextBtn" onclick="goNext(3)" disabled>기부 참여하기</button>
</div>

<div id="step3" class="step">
  <h2>기부 온도계</h2>
  <div class="thermometer-wrapper">
    <div class="cheer-bubble">배려의 온도가 올라가고 있어요! ❤️</div>
    <div id="thermoGroup3">
      <div class="thermometer-container"><div id="bar3" class="thermo-bar"></div></div>
      <div id="bulbText3" class="thermo-bulb">0%</div>
    </div>
    <div class="icon-cloud2">☁️</div><div class="icon-car">🚗</div><div class="icon-heart">❤️</div><div class="icon-star">⭐</div>
  </div>
  <div id="status3" style="font-size: 22px; font-weight: bold; margin: 10px 0;">현황 불러오는 중...</div>
  <div class="btn-group">
    <button onclick="handleDonate()">네 좋아요 ></button>
    <button class="btn-no" onclick="goNext(6)">아니요 ></button>
  </div>
</div>

<div id="step4" class="step">
  <h2 id="step4Title">기부 진행 중...</h2>
  <div class="thermometer-wrapper">
    <div id="thermoGroup4">
      <div class="thermometer-container"><div id="bar4" class="thermo-bar"></div></div>
      <div id="bulbText4" class="thermo-bulb">0%</div>
    </div>
  </div>
  <p id="amountText" style="font-size: 22px; font-weight: bold;">처리 중...</p>
  <button id="scratchBtn" onclick="goNext(5)" style="display:none; margin-top:20px;">럭키 스크래치 확인</button>
</div>

<div id="step5" class="step">
  <h2>럭키 스크래치</h2>
  <p>회색 부분을 슥슥 긁어주세요!</p>
  <div id="scratchContainer">
    <canvas id="scratch" width="300" height="150"></canvas>
  </div>
  <div id="resultBox" style="display:none; margin-top:20px;">
    <div id="resultText" style="background:#fff; border:2px dashed #ff4b2b; padding:15px; border-radius:10px; text-align:left;"></div>
    <button id="giftNextBtn" style="margin-top:20px; display:none;">다음 단계 ></button>
  </div>
</div>

<div id="phoneModal" class="modal-overlay">
  <div class="modal-content">
    <h2 style="color:#0047a0;">🎉 축하합니다!</h2>
    <p><b>'잠 깨우는 왕눈이' 스티커 당첨!</b></p>
    <input type="text" id="userName" class="input-field" placeholder="성함">
    <input type="tel" id="phoneInput" class="input-field" placeholder="연락처">
    <textarea id="userAddress" class="input-field" style="height:60px;" placeholder="배송지 주소"></textarea>
    <label style="font-size:12px;"><input type="checkbox" id="privacyAgree"> 개인정보 수집 및 발송 동의</label>
    <button onclick="submitDeliveryInfo()" style="margin-top:15px;">정보 입력하기</button>
  </div>
</div>

<div id="step6" class="step" style="padding: 0;">
  <div style="display: flex; flex-direction: column; align-items: center; min-height: 100vh;">
    <img src="safety_bye.jpg" style="width: 100%; height: auto; display: block;" alt="캠페인 종료">
    <div style="padding: 20px; text-align: center;">
      <div style="font-size: 20px; font-weight: bold; color: #0047a0; margin-top: 10px;">안전운전이 최고의 배려입니다!</div>
      <button onclick="location.reload()" style="margin-top: 40px; background: #666; width: 200px;">처음으로</button>
    </div>
  </div>
</div>

<script>
var API_URL = "https://script.google.com/macros/s/AKfycbxlMGp-SqifAirASBW0jQjQsnjHpesuBeSOw6oeihH1Nq31WdCm5O-B1GsqTRj_1HFR-A/exec"; 
var GOAL_AMOUNT = 10000000; 
var currentWinType = "";

window.onload = function() {
  fetch(API_URL).then(r => r.text()).then(t => {
    var amount = Number(t.split('|')[0]);
    if (amount >= GOAL_AMOUNT) {
      goNext(0);
      document.getElementById("step0Title").innerText = "캠페인 종료 안내";
      document.getElementById("step0Msg").innerHTML = "<b>목표 기부금이 모두 달성되었습니다.</b><br>보내주신 성원에 감사드립니다.";
    } else if (localStorage.getItem("participatedCampaign") === "true") {
      goNext(0);
      document.getElementById("step0Title").innerText = "참여 완료 안내";
      document.getElementById("step0Msg").innerHTML = "<b>이미 기부에 동참하셨습니다.</b><br>안전운전이 최고의 배려입니다!";
    }
  });
}

function goNext(n) {
  var steps = document.getElementsByClassName('step');
  for (var i = 0; i < steps.length; i++) steps[i].classList.remove('active');
  document.getElementById('step' + n).classList.add('active');
  if (n === 2) startTimer();
  if (n === 3) refreshStatus();
  if (n === 5) initScratch();
  window.scrollTo(0,0);
}

function startTimer() {
  var time = 5;
  var interval = setInterval(function() {
    time--;
    document.getElementById("timerNumber").innerText = (time > 0) ? time : "✓";
    if (time <= 0) { clearInterval(interval); document.getElementById("nextBtn").disabled = false; }
  }, 1000);
}

function refreshStatus() {
  document.getElementById("thermoGroup3").classList.add("thermo-group-blinking");
  fetch(API_URL).then(r => r.text()).then(t => {
    var amount = Number(t.split('|')[0]);
    document.getElementById("status3").innerText = amount.toLocaleString() + "원 적립 중";
    updateVerticalBar("bar3", amount, "bulbText3");
    setTimeout(() => document.getElementById("thermoGroup3").classList.remove("thermo-group-blinking"), 1000);
  });
}

function handleDonate() {
  localStorage.setItem("participatedCampaign", "true"); 
  goNext(4);
  document.getElementById("thermoGroup4").classList.add("thermo-group-blinking");
  fetch(API_URL, { method: "POST", body: new URLSearchParams({ type: "DONATE" }) })
  .then(res => res.text()).then(data => {
    var total = data.split('|')[1];
    document.getElementById("amountText").innerText = Number(total).toLocaleString() + "원 적립 완료!";
    document.getElementById("scratchBtn").style.display = "block";
    updateVerticalBar("bar4", total, "bulbText4");
    setTimeout(() => document.getElementById("thermoGroup4").classList.remove("thermo-group-blinking"), 1000);
  });
}

function updateVerticalBar(barId, amount, bulbId) {
  var per = Math.min((amount / GOAL_AMOUNT) * 100, 100);
  document.getElementById(barId).style.height = per + "%";
  document.getElementById(bulbId).innerText = per.toFixed(1) + "%";
}

function initScratch() {
  var cvs = document.getElementById("scratch"), ctx = cvs.getContext("2d");
  var container = document.getElementById("scratchContainer");
  var resBox = document.getElementById("resultBox"), resTxt = document.getElementById("resultText");
  var giftBtn = document.getElementById("giftNextBtn");
  var drawing = false, revealed = false;

  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#aaa"; ctx.fillRect(0, 0, 300, 150);
  ctx.fillStyle = "#fff"; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("슥슥 긁어보세요!", 150, 85);

  function checkReveal() {
    if (revealed) return;
    var pix = ctx.getImageData(0,0,300,150).data, t = 0;
    for (var i=3; i<pix.length; i+=4) if(pix[i] === 0) t++;
    if ((t/(300*150)) > 0.4) {
      revealed = true;
      ctx.clearRect(0, 0, 300, 150);
      ctx.globalCompositeOperation = "source-over";
      
      fetch(API_URL, { method: "POST", body: new URLSearchParams({ type: "CHECK_WIN" }) })
      .then(r => r.json()).then(data => {
        currentWinType = data.result;
        resBox.style.display = "block";

        if (currentWinType === "STICKER") {
          container.style.backgroundImage = "url('large_eye.jpg')";
          resTxt.innerHTML = "<b>🎉 당첨! '잠 깨우는 왕눈이' 스티커</b><br>아래 버튼을 눌러 배송 정보를 입력해주세요.";
          giftBtn.innerText = "배송 정보 입력하기";
          giftBtn.onclick = () => document.getElementById("phoneModal").style.display = "flex";
        } else {
          container.style.backgroundImage = "none";
          ctx.fillStyle = "#0047a0"; ctx.font = "bold 24px sans-serif"; ctx.textAlign = "center";
          if (currentWinType === "DOUBLE") {
            ctx.fillText("기부금 2배 적립 당첨!", 150, 85);
            resTxt.innerText = "축하합니다! 기부금이 2배로 적립되었습니다.";
          } else {
            ctx.fillText("아쉽지만 꽝입니다!", 150, 85);
            resTxt.innerText = "따뜻한 마음을 나누어 주셔서 감사합니다.";
          }
          giftBtn.innerText = "참여 완료";
          giftBtn.onclick = () => goNext(6);
        }
        giftBtn.style.display = "block";
      });
    }
  }

  function scratch(e) {
    if (!drawing || revealed) return;
    var r = cvs.getBoundingClientRect();
    var cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    var cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath(); ctx.arc(cx, cy, 25, 0, Math.PI * 2); ctx.fill();
    checkReveal();
  }
  cvs.onmousedown = () => drawing = true; cvs.onmousemove = scratch; window.onmouseup = () => drawing = false;
  cvs.ontouchstart = (e) => { drawing = true; e.preventDefault(); }; cvs.ontouchmove = (e) => { scratch(e); e.preventDefault(); };
}

function submitDeliveryInfo() {
  var name = document.getElementById("userName").value;
  var phone = document.getElementById("phoneInput").value;
  var address = document.getElementById("userAddress").value;
  if (!name || !phone || !address || !document.getElementById("privacyAgree").checked) { alert("모든 정보를 입력하고 동의해주세요."); return; }
  fetch(API_URL, { method: "POST", body: new URLSearchParams({ type: "PHONE", name: name, phone: phone, address: address, resultType: currentWinType }) })
  .then(() => { alert("접수되었습니다!"); document.getElementById("phoneModal").style.display = "none"; goNext(6); });
}
</script>
</body>
</html>
