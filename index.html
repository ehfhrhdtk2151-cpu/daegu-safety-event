<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전기뷰(Give U) 캠페인</title>
<style>
  body { margin:0; font-family: sans-serif; text-align:center; background:#f9f9f9; color: #333; overflow-x: hidden; }
  .step { display:none; padding:20px; max-width: 500px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; }
  .active { display:block; }
  h2 { color: #0047a0; margin-top: 10px; }
  button { 
    padding:18px 25px; font-size:18px; margin-top:20px; width: 100%;
    border: none; border-radius: 10px; background: #0047a0; color: white; font-weight: bold;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  button:disabled { background: #ccc; cursor: default; }
  .safety-img { width:100%; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
  
  /* 카운트다운 숫자 스타일 */
  #countdownContainer { margin-top: 15px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #timerNumber { font-size: 40px; font-weight: bold; color: #ff4b2b; transition: all 0.3s; }
  .timer-bounce { transform: scale(1.3); } /* 숫자 커지는 애니메이션 효과 */

  .bar-wrap { width:100%; margin:30px auto; border:1px solid #ddd; height:35px; border-radius: 20px; overflow: hidden; background: #eee; position: relative; }
  .bar { height:100%; width:0%; background: linear-gradient(90deg, #ff4b2b, #ff416c); position: absolute; left: 0; top: 0; }
  #amountText { font-size: 24px; font-weight: bold; color: #ff4b2b; }
  
  canvas { border:2px solid #ddd; margin-top:20px; touch-action: none; border-radius: 10px; background-color: #fff; }
  #resultDisplay { margin-top: 20px; font-size: 22px; color: #0047a0; font-weight: bold; min-height: 100px; pointer-events: none; }
</style>
</head>
<body>

<div id="step1" class="step active">
  <h2>안전기뷰(Give U)</h2>
  <p>잠시 쉬며 안전을 충전하세요!<br>참여하시면 기부금이 전달됩니다.</p>
  <button onclick="next(2)">캠페인 참여하기</button>
</div>

<div id="step2" class="step">
  <h2>안전운전 약속하기</h2>
  <img src="safety.jpg" class="safety-img">
  
  <div id="countdownContainer">
    <div id="timerNumber">3</div>
    <div id="timerSubText" style="font-size: 14px; color: #666;">안전 수칙을 확인해 주세요</div>
  </div>

  <button id="nextBtn" onclick="next(3)" disabled>확인했습니다</button>
</div>

<div id="step3" class="step">
  <h2>안전 나눔</h2>
  <p>확인 버튼을 누르면 500원이 자동으로 기부됩니다.</p>
  <button onclick="donate()">기부하고 복권 받기</button>
</div>

<div id="step4" class="step">
  <h2>기부 완료!</h2>
  <div class="bar-wrap"><div id="bar" class="bar"></div></div>
  <p id="amountText">0원</p>
  <button onclick="next(5)">럭키 스크래치 확인</button>
</div>

<div id="step5" class="step">
  <h2>럭키 스크래치</h2>
  <p>회색 부분을 50% 이상 긁어주세요!</p>
  <canvas id="scratch" width="300" height="150"></canvas>
  <div id="resultDisplay"></div>
</div>

<script>
const API_URL = "여기에_AppsScript_URL"; 
let resultValue = "LOSE";

function next(n){
  const steps = document.getElementsByClassName('step');
  for(let i=0; i<steps.length; i++) { steps[i].classList.remove('active'); }
  document.getElementById('step' + n).classList.add('active');
  
  if(n === 2) { startTimer(); }
  if(n === 5) { initScratch(); }
}

function startTimer() {
  let timeLeft = 3;
  const timerNum = document.getElementById("timerNumber");
  const subText = document.getElementById("timerSubText");
  const nextBtn = document.getElementById("nextBtn");
  
  nextBtn.disabled = true;
  timerNum.innerText = timeLeft;
  timerNum.classList.add("timer-bounce"); // 첫 숫자 강조

  const timerId = setInterval(() => {
    timeLeft--;
    timerNum.classList.remove("timer-bounce"); // 애니메이션 초기화
    
    // 브라우저 렌더링을 위한 아주 짧은 지연 후 다시 애니메이션 적용
    setTimeout(() => {
      if (timeLeft > 0) {
        timerNum.innerText = timeLeft;
        timerNum.classList.add("timer-bounce");
      } else {
        clearInterval(timerId);
        timerNum.innerText = "✓"; // 확인 완료 표시
        timerNum.style.color = "#0047a0";
        subText.innerText = "확인 버튼을 눌러주세요";
        nextBtn.disabled = false;
      }
    }, 50);
  }, 1000);
}

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: new URLSearchParams({ phone: "user_" + Date.now() })
    });
    const data = await res.text();
