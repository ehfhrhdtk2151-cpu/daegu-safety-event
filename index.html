<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin:0; font-family:sans-serif; text-align:center; background:#f5f5f5; }
.step { display:none; padding:20px; }
.active { display:block; }
button { padding:15px 25px; font-size:18px; margin-top:20px; }
canvas { border:1px solid #ccc; margin-top:20px; }

/* 온도계 */
.bar-wrap {
  width:80%;
  margin:20px auto;
  border:1px solid #ccc;
  height:30px;
}
.bar {
  height:100%;
  width:0%;
  background:red;
}
</style>
</head>

<body>

<!-- STEP 1 -->
<div id="step1" class="step active">
  <h2>STEP 1 쉬어가기</h2>
  <p>잠시 쉬어가세요 ??</p>
  <button onclick="next(2)">캠페인 참여하기</button>
</div>

<!-- STEP 2 -->
<div id="step2" class="step">
  <h2>STEP 2 알아가기</h2>

  <!-- 여기 이미지 파일 넣기 -->
  <img src="safety.jpg" style="width:100%; max-width:400px;">

  <button id="nextBtn" onclick="next(3)" disabled>확인했습니다</button>
</div>

<!-- STEP 3 -->
<div id="step3" class="step">
  <h2>STEP 3 나누기</h2>
  <p>안전을 나누어 주세요</p>
  <button onclick="donate()">500원 기부 참여하기</button>
</div>

<!-- STEP 4 (온도계) -->
<div id="step4" class="step">
  <h2>기부 완료 ??</h2>

  <div class="bar-wrap">
    <div id="bar" class="bar"></div>
  </div>

  <p id="amountText">0원</p>

  <button onclick="next(5)">스크래치 복권 확인</button>
</div>

<!-- STEP 5 (스크래치) -->
<div id="step5" class="step">
  <h2>스크래치 복권 ??</h2>
  <p>긁어서 결과 확인!</p>
  <canvas id="scratch" width="300" height="150"></canvas>
  <h3 id="resultText"></h3>
</div>

<script>
// 서버 URL 넣기
const API_URL = "여기에_AppsScript_URL";

// 결과 저장
let resultValue = "LOSE";

// STEP 이동
function next(n){
  document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
  document.getElementById('step'+n).classList.add('active');

  if(n === 5){
    initScratch();
  }
}

// STEP2 버튼 지연 활성화
setTimeout(()=>{
  const btn = document.getElementById("nextBtn");
  if(btn) btn.disabled = false;
}, 3000);

// 기부 처리
function donate(){
  fetch(API_URL, {
    method: "POST",
    body: new URLSearchParams({
      phone: "user_" + Math.random()
    })
  })
  .then(res => res.text())
  .then(data => {

    if(data === "DUPLICATE"){
      alert("이미 참여하셨습니다");
      return;
    }

    resultValue = data;

    // 기부금 증가
    let current = localStorage.getItem("donation") || 0;
    current = Number(current) + 500;
    localStorage.setItem("donation", current);

    updateBar(current);

    next(4);
  });
}

// 온도계 업데이트
function updateBar(amount){
  const goal = 10000000;
  const percent = Math.min((amount / goal) * 100, 100);

  document.getElementById("bar").style.width = percent + "%";
  document.getElementById("amountText").innerText =
    amount.toLocaleString() + "원";
}

// 스크래치 기능
function initScratch(){
  const canvas = document.getElementById("scratch");
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "gray";
  ctx.fillRect(0,0,300,150);

  canvas.addEventListener("mousemove", function(e){
    ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath();
    ctx.arc(e.offsetX, e.offsetY, 12, 0, Math.PI*2);
    ctx.fill();
  });

  document.getElementById("resultText").innerText =
    resultValue === "WIN" ? "?? 당첨!" : "?? 꽝";
}
</script>

</body>
</html>
