<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전기뷰(Give U) 캠페인</title>
<style>
  body { margin:0; font-family: sans-serif; text-align:center; background:#f9f9f9; color: #333; }
  .step { display:none; padding:20px; max-width: 500px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; }
  .active { display:block; }
  h2 { color: #0047a0; margin-top: 10px; }
  button { 
    padding:18px 25px; font-size:18px; margin-top:20px; width: 100%;
    border: none; border-radius: 10px; background: #0047a0; color: white; font-weight: bold;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  button:disabled { background: #ccc; cursor: default; }
  .safety-img { width:100%; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
  
  /* 카운트다운 스타일 */
  #timerNumber { font-size: 40px; font-weight: bold; color: #ff4b2b; margin: 10px 0; }
  
  /* 온도계 스타일 */
  .bar-wrap { width:100%; margin:30px 0; border:1px solid #ddd; height:35px; border-radius: 20px; overflow: hidden; background: #eee; position: relative; }
  .bar { height:100%; width:0%; background: linear-gradient(90deg, #ff4b2b, #ff416c); position: absolute; left: 0; top: 0; transition: width 1s ease; }
  #amountText { font-size: 24px; font-weight: bold; color: #ff4b2b; }
  
  /* 스크래치 및 개인정보 문구 */
  canvas { border:2px solid #ddd; margin-top:20px; touch-action: none; border-radius: 10px; background:#fff; }
  #resultDisplay { margin-top: 20px; font-size: 18px; font-weight: bold; min-height: 120px; }
  .privacy-info { font-size: 12px; color: #888; margin-top: 15px; line-height: 1.4; text-align: left; background: #eee; padding: 10px; border-radius: 5px; }
</style>
</head>
<body>

<div id="step1" class="step active">
  <h2>안전기뷰(Give U)</h2>
  <p>잠시 쉬며 안전을 충전하세요!<br>참여하시면 기부금이 전달됩니다.</p>
  <button onclick="goNext(2)">캠페인 참여하기</button>
</div>

<div id="step2" class="step">
  <h2>안전운전 약속하기</h2>
  <img src="safety.jpg" class="safety-img">
  <div id="timerNumber">3</div>
  <p style="font-size: 14px; color: #666;">안전 수칙을 3초간 확인해 주세요.</p>
  <button id="nextBtn" onclick="goNext(3)" disabled>확인했습니다</button>
</div>

<div id="step3" class="step">
  <h2>안전 나눔</h2>
  <p>기부하기 버튼을 누르면<br><b>500원</b>이 자동으로 기부됩니다.</p>
  <button onclick="handleDonate()">기부하고 복권 받기</button>
</div>

<div id="step4" class="step">
  <h2>기부 완료!</h2>
  <div class="bar-wrap"><div id="bar" class="bar"></div></div>
  <p id="amountText">0원</p>
  <button onclick="goNext(5)">럭키 스크래치 확인</button>
</div>

<div id="step5" class="step">
  <h2>럭키 스크래치</h2>
  <p>회색 부분을 50% 이상 긁어주세요!</p>
  <canvas id="scratch" width="300" height="150"></canvas>
  <div id="resultDisplay"></div>
  
  <div class="privacy-info">
    <b>[개인정보 수집 및 이용 안내]</b><br>
    - 수집 항목: 휴대전화 번호 (당첨 시에 한함)<br>
    - 이용 목적: 경품(커피 쿠폰) 발송 및 중복 참여 방지<br>
    - 보유 기간: <b>경품 발송 완료 후 즉시 파기</b>
  </div>
</div>

<script>
var API_URL = "https://script.google.com/macros/s/AKfycbyPywvkEIQUTNVyJxd6Yc8QEbEkEQQLGMGv95d1GhtMgEhmDgfDTFREvxmrbyvVd0MQ_g/exec"; 
var resultValue = "LOSE";

function goNext(n) {
  var steps = document.getElementsByClassName('step');
  for (var i = 0; i < steps.length; i++) { steps[i].classList.remove('active'); }
  document.getElementById('step' + n).classList.add('active');
  if (n === 2) { startTimer(); }
  if (n === 5) { initScratch(); }
}

function startTimer() {
  var time = 3;
  var btn = document.getElementById("nextBtn");
  var num = document.getElementById("timerNumber");
  btn.disabled = true;
  var interval = setInterval(function() {
    time--;
    if (time > 0) { num.innerText = time; } 
    else { clearInterval(interval); num.innerText = "✓"; num.style.color = "#0047a0"; btn.disabled = false; }
  }, 1000);
}

function handleDonate() {
  // 우선 다음 화면으로 이동 (사용자 체감 속도 향상)
  goNext(4);
  
  fetch(API_URL, {
    method: "POST",
    body: new URLSearchParams({ phone: "PRE_CHECK" }) // 초기 기부 기록
  })
  .then(function(res) { return res.text(); })
  .then(function(data) {
    var parts = data.split('|');
    resultValue = parts[0];
    var total = parts[1];
    updateBar(total);
  });
}

function updateBar(amount) {
  var bar = document.getElementById("bar");
  var txt = document.getElementById("amountText");
  var goal = 10000000;
  var per = Math.max((amount / goal) * 100, 5);
  bar.style.width = per + "%";
  txt.innerText = Number(amount).toLocaleString() + "원";
}

function initScratch() {
  var cvs = document.getElementById("scratch");
  var ctx = cvs.getContext("2d");
  var disp = document.getElementById("resultDisplay");
  var drawing = false;
  var revealed = false;

  ctx.fillStyle = "#aaa";
  ctx.fillRect(0, 0, 300, 150);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 18px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("슥슥 긁어보세요!", 150, 85);

  function checkReveal() {
    if (revealed) return;
    var pix = ctx.getImageData(0,0,300,150).data;
    var t = 0;
    for (var i=3; i<pix.length; i+=4) { if(pix[i] === 0) t++; }
    if ((t/(300*150)) > 0.5) {
      revealed = true;
      if (resultValue === "WIN") {
        var phone = prompt("🎁 당첨을 축하드립니다!\n커피 쿠폰 발송을 위해 전화번호를 입력해주세요.\n(예: 01012345678)");
        if (phone) {
          // 전화번호 서버 전송 (이미 기록된 행에 업데이트하거나 새 로그 남기기)
          fetch(API_URL, { method: "POST", body: new URLSearchParams({ phone: phone }) });
          disp.innerHTML = "<div style='color:#0047a0;'>✅ 등록 완료!<br>쿠폰이 곧 발송됩니다.</div>";
        } else {
          disp.innerHTML = "<div style='color:red;'>번호를 입력하지 않으시면<br>경품 발송이 어렵습니다.</div>";
        }
      } else {
        disp.innerHTML = "🙏 다음 기회에!<br>안전운전 하세요.";
      }
    }
  }

  function getPos(e) {
    var r = cvs.getBoundingClientRect();
    var cx = e.touches ? e.touches[0].clientX : e.clientX;
    var cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: cx - r.left, y: cy - r.top };
  }

  function scratch(e) {
    if (!drawing) return;
    var p = getPos(e);
    ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath(); ctx.arc(p.x, p.y, 25, 0, Math.PI * 2); ctx.fill();
    checkReveal();
  }

  cvs.addEventListener("mousedown", function() { drawing = true; });
  cvs.addEventListener("mousemove", scratch);
  window.addEventListener("mouseup", function() { drawing = false; });
  cvs.addEventListener("touchstart", function(e) { drawing = true; e.preventDefault(); }, {passive:false});
  cvs.addEventListener("touchmove", function(e) { scratch(e); e.preventDefault(); }, {passive:false});
  cvs.addEventListener("touchend", function() { drawing = false; });
}
</script>
</body>
</html>
