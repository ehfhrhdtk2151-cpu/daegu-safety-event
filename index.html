<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전기뷰 캠페인</title>
<style>
  body { margin:0; font-family: sans-serif; text-align:center; background:#f9f9f9; }
  .step { display:none; padding:20px; max-width: 500px; margin: 0 auto; min-height: 100vh; }
  .active { display:block; }
  button { 
    padding:18px; font-size:18px; margin-top:20px; width: 100%;
    border: none; border-radius: 10px; background: #0047a0; color: white; font-weight: bold;
    cursor: pointer;
  }
  button:disabled { background: #ccc; }
  .safety-img { width:100%; border-radius: 12px; }
  .bar-wrap { width:100%; margin:30px 0; border:1px solid #ddd; height:30px; border-radius: 15px; overflow: hidden; background: #eee; position: relative; }
  .bar { height:100%; width:0%; background: red; position: absolute; left: 0; top: 0; transition: width 1s ease; }
  canvas { border:1px solid #ccc; margin-top:20px; touch-action: none; background:#fff; }
  #resultDisplay { margin-top: 20px; font-size: 20px; font-weight: bold; min-height: 80px; }
</style>
</head>
<body>

<div id="step1" class="step active">
  <h2>안전기뷰(Give U)</h2>
  <p>잠시 쉬며 안전을 충전하세요!</p>
  <button onclick="goNext(2)">캠페인 참여하기</button>
</div>

<div id="step2" class="step">
  <h2>안전운전 약속하기</h2>
  <img src="safety.jpg" class="safety-img">
  <div id="timerNum" style="font-size:40px; color:red; margin:10px;">3</div>
  <button id="nextBtn" onclick="goNext(3)" disabled>확인했습니다</button>
</div>

<div id="step3" class="step">
  <h2>안전 나눔</h2>
  <p>500원이 자동으로 기부됩니다.</p>
  <button onclick="handleDonate()">기부하고 복권 받기</button>
</div>

<div id="step4" class="step">
  <h2>기부 완료!</h2>
  <div class="bar-wrap"><div id="bar" class="bar"></div></div>
  <p id="amountText">0원</p>
  <button onclick="goNext(5)">복권 긁기</button>
</div>

<div id="step5" class="step">
  <h2>럭키 스크래치</h2>
  <canvas id="scratch" width="300" height="150"></canvas>
  <div id="resultDisplay"></div>
</div>

<script>
  // 페이지 시작 시 누적 데이터 가져오기
window.onload = function() {
  fetch(API_URL)
    .then(res => res.text())
    .then(amount => {
      // 초기 온도계 수치 업데이트 (기부 완료 전 미리 보여주기용)
      localStorage.setItem("totalDonation", amount);
    });
};
// Apps Script URL을 여기에 넣으세요
var API_URL = "https://script.google.com/macros/s/AKfycbzmgFkdpMbEJaejpBXwLPmSZXfBp4NjI9_hO3ytGjjPqPcLmsQl1duhqqpz2_Krzuj9ww/exec"; 
var resultValue = "LOSE";

function goNext(n) {
  var steps = document.getElementsByClassName('step');
  for (var i = 0; i < steps.length; i++) { steps[i].classList.remove('active'); }
  document.getElementById('step' + n).classList.add('active');
  
  if (n === 2) { startTimer(); }
  if (n === 5) { initScratch(); }
}

function startTimer() {
  var time = 3;
  var btn = document.getElementById("nextBtn");
  var num = document.getElementById("timerNum");
  btn.disabled = true;
  
  var interval = setInterval(function() {
    time--;
    if (time > 0) {
      num.innerText = time;
    } else {
      clearInterval(interval);
      num.innerText = "✓";
      btn.disabled = false;
    }
  }, 1000);
}

function handleDonate() {
  // 테스트를 위해 우선 다음 단계로 바로 이동하게 설정
  var currentTotal = Number(localStorage.getItem("totalDonation") || 0) + 500;
  localStorage.setItem("totalDonation", currentTotal);
  
  updateBar(currentTotal);
  goNext(4);

  // 실제 서버 통신 (배포 시 URL 확인 필수)
  fetch(API_URL, {
    method: "POST",
    body: new URLSearchParams({ phone: "user_" + Date.now() })
  }).then(function(res) { return res.text(); })
    .then(function(data) {
      resultValue = data.split('|')[0] || "LOSE";
    }).catch(function(e) { console.log("서버 연결 안됨"); });
}

function updateBar(amount) {
  var bar = document.getElementById("bar");
  var txt = document.getElementById("amountText");
  var goal = 10000000;
  var per = Math.max((amount / goal) * 100, 5); // 최소 5%

  setTimeout(function() {
    bar.style.width = per + "%";
    txt.innerText = amount.toLocaleString() + "원";
  }, 500);
}

function initScratch() {
  var cvs = document.getElementById("scratch");
  var ctx = cvs.getContext("2d");
  var disp = document.getElementById("resultDisplay");
  var drawing = false;
  var revealed = false;

  ctx.fillStyle = "#aaa";
  ctx.fillRect(0, 0, 300, 150);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 18px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("50% 이상 긁어보세요", 150, 85);

  function getPos(e) {
    var r = cvs.getBoundingClientRect();
    var cx = e.touches ? e.touches[0].clientX : e.clientX;
    var cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: cx - r.left, y: cy - r.top };
  }

  function scratch(e) {
    if (!drawing) return;
    var p = getPos(e);
    ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath();
    ctx.arc(p.x, p.y, 25, 0, Math.PI * 2);
    ctx.fill();
    
    if (!revealed && Math.random() > 0.9) {
      var pix = ctx.getImageData(0,0,300,150).data;
      var t = 0;
      for (var i=3; i<pix.length; i+=4) { if(pix[i] === 0) t++; }
      if ((t/(300*150)) > 0.5) {
        revealed = true;
        disp.innerHTML = resultValue === "WIN" ? "🎁 당첨! 커피" : "🙏 다음 기회에!";
        setTimeout(function() {
          disp.innerHTML += "<div style='color:red; margin-top:10px;'>❤️ 안전운행 하세요! ❤️</div>";
        }, 900);
      }
    }
  }

  cvs.addEventListener("mousedown", function(e) { drawing = true; });
  cvs.addEventListener("mousemove", scratch);
  window.addEventListener("mouseup", function() { drawing = false; });
  cvs.addEventListener("touchstart", function(e) { drawing = true; e.preventDefault(); }, {passive:false});
  cvs.addEventListener("touchmove", function(e) { scratch(e); e.preventDefault(); }, {passive:false});
  cvs.addEventListener("touchend", function() { drawing = false; });
}
</script>
</body>
</html>
