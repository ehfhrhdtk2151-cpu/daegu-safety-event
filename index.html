<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전기뷰(Give U) 캠페인</title>
<style>
  body { margin:0; font-family: sans-serif; text-align:center; background:#f9f9f9; color: #333; }
  .step { display:none; padding:20px; max-width: 500px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; }
  .active { display:block; }
  h2 { color: #0047a0; margin-top: 10px; }
  button { padding:18px 25px; font-size:18px; margin-top:20px; width: 100%; border: none; border-radius: 10px; background: #0047a0; color: white; font-weight: bold; cursor: pointer; }
  button:disabled { background: #ccc; }
  .safety-img { width:100%; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
  #timerNumber { font-size: 40px; font-weight: bold; color: #ff4b2b; margin: 10px 0; }
  .bar-wrap { width:100%; margin:30px 0; border:1px solid #ddd; height:35px; border-radius: 20px; overflow: hidden; background: #eee; position: relative; }
  .bar { height:100%; width:0%; background: linear-gradient(90deg, #ff4b2b, #ff416c); position: absolute; left: 0; top: 0; transition: width 0.8s ease-out; }
 #amountText { 
  font-size: 24px; 
  font-weight: bold; 
  color: #ff4b2b; 
  min-height: 40px; 
  display: flex;
  align-items: center;
  justify-content: center;
  /* transition을 여기에 넣지 말고 자바스크립트에서 조절하는 게 더 정확합니다 */
}
  canvas { border:2px solid #ddd; margin-top:20px; touch-action: none; border-radius: 10px; background:#fff; }
  #resultDisplay { margin-top: 20px; font-size: 18px; font-weight: bold; min-height: 120px; }
  .privacy-info { font-size: 11px; color: #888; margin-top: 15px; line-height: 1.4; text-align: left; background: #eee; padding: 10px; border-radius: 5px; }
</style>
</head>
<body>

<div id="step1" class="step active">
  <h2>안전기뷰(Give U)</h2>
  <p>잠시 쉬며 안전을 충전하세요!<br>참여하시면 기부금이 전달됩니다.</p>
  <button onclick="goNext(2)">캠페인 참여하기</button>
</div>

<div id="step2" class="step">
  <h2>안전운전 약속하기</h2>
  <img src="safety.jpg" class="safety-img">
  <div id="timerNumber">3</div>
  <p style="font-size: 14px; color: #666;">안전 수칙을 3초간 확인해 주세요.</p>
  <button id="nextBtn" onclick="goNext(3)" disabled>확인했습니다</button>
</div>

<div id="step3" class="step">
  <h2>안전 나눔</h2>
  <p>기부하기 버튼을 누르면<br><b>500원</b>이 자동으로 기부됩니다.</p>
  <button onclick="handleDonate()">기부하고 복권 받기</button>
</div>

<div id="step4" class="step">
  <h2>기부 완료!</h2>
  <div class="bar-wrap"><div id="bar" class="bar"></div></div>
  <p id="amountText">0원</p>
  <button onclick="goNext(5)">럭키 스크래치 확인</button>
</div>

<div id="step5" class="step">
  <h2>럭키 스크래치</h2>
  <p>회색 부분을 50% 이상 긁어주세요!</p>
  <canvas id="scratch" width="300" height="150"></canvas>
  <div id="resultDisplay"></div>
  <div class="privacy-info">
    <b>[개인정보 수집 및 이용 안내]</b><br>
    - 수집 항목: 휴대전화 번호 (당첨 시에 한함)<br>
    - 이용 목적: 경품(커피 쿠폰) 발송용<br>
    - 보유 기간: <b>경품 발송 완료 후 즉시 파기</b>
  </div>
</div>

<script>
var API_URL = "https://script.google.com/macros/s/AKfycbzVuM3sCCQD4J3wmW1eCk7UKYxlfdUa2f5UYzMi_AgfxHm3X_HgZ84IOiEQ_CJ1Dna8gg/exec"; 

function goNext(n) {
  var steps = document.getElementsByClassName('step');
  for (var i = 0; i < steps.length; i++) { steps[i].classList.remove('active'); }
  document.getElementById('step' + n).classList.add('active');
  if (n === 2) { startTimer(); }
  if (n === 5) { initScratch(); }
}

function startTimer() {
  var time = 3;
  var btn = document.getElementById("nextBtn");
  var num = document.getElementById("timerNumber");
  btn.disabled = true;
  var interval = setInterval(function() {
    time--;
    if (time > 0) { num.innerText = time; } 
    else { clearInterval(interval); num.innerText = "✓"; num.style.color = "#0047a0"; btn.disabled = false; }
  }, 1000);
}

function handleDonate() {
  goNext(4);
  
  var txt = document.getElementById("amountText");
  
  // 1. [핵심] 기존 텍스트 완전 초기화 및 안내 문구 강제 삽입
  txt.style.transition = "none"; 
  txt.style.opacity = "1";
  txt.style.fontSize = "16px";
  txt.style.color = "#888";
  txt.innerText = "기부 현황을 불러오는 중..."; 

  // 2. 온도계 바만 즉시 이동 (이때 updateBar 내부에서 txt를 건드리지 않게 처리)
  var currentTotal = (Number(localStorage.getItem("totalDonation") || 0)) + 500;
  moveBarOnly(currentTotal); 

  // 3. 서버 통신
  fetch(API_URL, {
    method: "POST",
    body: new URLSearchParams({ type: "DONATE" })
  })
  .then(function(res) { return res.text(); })
  .then(function(data) {
    var serverTotal = data.split('|')[1];
    localStorage.setItem("totalDonation", serverTotal);
    
    // 4. 서버 데이터 도착 후 0.5초 정도 문구를 더 보여준 뒤 숫자로 교체
    setTimeout(function() {
      txt.style.transition = "all 0.5s";
      txt.innerText = Number(serverTotal).toLocaleString() + "원";
      txt.style.fontSize = "26px";
      txt.style.color = "#ff4b2b";
      moveBarOnly(serverTotal); 
    }, 500); 
  });
}

// [추가] 글자는 건드리지 않고 '온도계 바'만 움직이는 함수
function moveBarOnly(amount) {
  var bar = document.getElementById("bar");
  var goal = 10000000;
  var per = Math.max((amount / goal) * 100, 5);
  bar.style.width = per + "%";
}

// 기존 updateBar는 초기 로딩 등에서 필요할 수 있으니 유지하되 간섭 최소화
function updateBar(amount) {
  moveBarOnly(amount);
  var txt = document.getElementById("amountText");
  // 안내 문구 출력 중일 때는 숫자로 덮어쓰지 않음
  if(txt.innerText.indexOf("불러오는") === -1) {
    txt.innerText = Number(amount).toLocaleString() + "원";
  }
}

function initScratch() {
  var cvs = document.getElementById("scratch");
  var ctx = cvs.getContext("2d");
  var disp = document.getElementById("resultDisplay");
  var drawing = false;
  var revealed = false;

  ctx.fillStyle = "#aaa";
  ctx.fillRect(0, 0, 300, 150);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 16px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("슥슥 긁어보세요!", 150, 85);

  function checkReveal() {
    if (revealed) return;
    var pix = ctx.getImageData(0,0,300,150).data;
    var t = 0;
    for (var i=3; i<pix.length; i+=4) { if(pix[i] === 0) t++; }
    
    if ((t/(300*150)) > 0.5) {
      revealed = true;
      disp.innerHTML = "결과 확인 중...";

      fetch(API_URL, { method: "POST", body: new URLSearchParams({ type: "SCRATCH" }) })
      .then(res => res.text())
      .then(result => {
        if (result === "WIN") {
          var phone = prompt("🎁 당첨! 안전드림 커피 쿠폰 발송을 위해\n전화번호를 입력해주세요. (예: 01012345678)");
          if (phone) {
            fetch(API_URL, { method: "POST", body: new URLSearchParams({ type: "PHONE", phone: phone }) });
            disp.innerHTML = "<div style='color:#0047a0;'>✅ 등록 완료! 쿠폰이 곧 발송됩니다.</div>";
          } else {
            disp.innerHTML = "<div style='color:red;'>번호 미입력으로 당첨이 취소될 수 있습니다.</div>";
          }
        } else {
          disp.innerHTML = "🙏 다음 기회에! 안전운전 하세요.";
        }
      });
    }
  }

  function getPos(e) {
    var r = cvs.getBoundingClientRect();
    var cx = e.touches ? e.touches[0].clientX : e.clientX;
    var cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: cx - r.left, y: cy - r.top };
  }

  function scratch(e) {
    if (!drawing) return;
    var p = getPos(e);
    ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, Math.PI * 2); ctx.fill();
    checkReveal();
  }

  cvs.addEventListener("mousedown", () => drawing = true);
  cvs.addEventListener("mousemove", scratch);
  window.addEventListener("mouseup", () => drawing = false);
  cvs.addEventListener("touchstart", (e) => { drawing = true; e.preventDefault(); }, {passive:false});
  cvs.addEventListener("touchmove", (e) => { scratch(e); e.preventDefault(); }, {passive:false});
  cvs.addEventListener("touchend", () => drawing = false);
}
</script>
</body>
</html>
